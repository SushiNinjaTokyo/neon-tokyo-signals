name: Render JP daily page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/render_daily_jp.py"
      - "templates/daily_jp.html.j2"
      - "templates/daily_jp.css"
      - "site/data/daily-jp/latest.json"
      - "requirements-render.txt"
      - ".github/workflows/render-daily-jp.yml"

permissions:
  contents: write

concurrency:
  group: render-daily-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-daily:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      DAILY_JSON: site/data/daily-jp/latest.json
      DAILY_MAIN_RANK_LIMIT: "20"
      DAILY_REFERENCE_LIMIT: "50"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate render script
        run: |
          set -euo pipefail
          python -m compileall scripts/render_daily_jp.py

      - name: Verify daily JSON exists
        run: |
          set -euo pipefail

          if [ ! -f site/data/daily-jp/latest.json ]; then
            echo "site/data/daily-jp/latest.json does not exist."
            echo "Run Build JP daily signals first."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("site/data/daily-jp/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("schema_version") == "daily-jp-v2", data.get("schema_version")
          assert isinstance(data.get("items"), list), "items must be a list"
          assert len(data.get("items") or []) > 0, "items is empty"
          assert isinstance(data.get("summary"), dict), "summary is missing"
          assert isinstance(data.get("market_pulse"), list), "market_pulse must be a list"
          assert data.get("regime"), "regime is missing"

          print("daily_json=ok")
          print("items_count=", len(data.get("items") or []))
          print("all_items_count=", len(data.get("all_items") or []))
          print("generated_at=", data.get("generated_at"))
          print("top_symbol=", (data.get("summary") or {}).get("top_symbol"))
          PY

      - name: Render JP daily page
        run: |
          set -euo pipefail
          python scripts/render_daily_jp.py

      - name: Verify rendered files
        run: |
          set -euo pipefail

          test -f site/japan/daily/index.html
          test -f site/assets/daily_jp.css

          grep -q "Daily Japan Signals" site/japan/daily/index.html
          grep -q "DAILY JP EVENT SCORE V2" site/japan/daily/index.html
          grep -q "MAIN DAILY BOARD" site/japan/daily/index.html
          grep -q "TOP 20 MAIN BOARD" site/japan/daily/index.html
          grep -q "SETUP QUALITY MAP" site/japan/daily/index.html
          grep -q "FAVORED SETUPS" site/japan/daily/index.html
          grep -q "RISK WARNINGS" site/japan/daily/index.html
          grep -q "REFERENCE ONLY" site/japan/daily/index.html
          grep -q "Trade" site/japan/daily/index.html
          grep -q "Watch" site/japan/daily/index.html
          grep -q "Ignore" site/japan/daily/index.html

      - name: Commit rendered daily page
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/japan/daily/index.html site/assets/daily_jp.css

          if git diff --cached --quiet; then
            echo "No rendered daily page changes to commit."
            exit 0
          fi

          git commit -m "Render JP daily page"
          git push
