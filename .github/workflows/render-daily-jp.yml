name: Render JP daily page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/render_daily_jp.py"
      - "templates/daily_jp.html.j2"
      - "templates/daily_jp.css"
      - "site/data/daily-jp/latest.json"
      - "requirements-render.txt"
      - ".github/workflows/render-daily-jp.yml"

permissions:
  contents: write

concurrency:
  group: render-daily-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-daily:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      DAILY_JSON: site/data/daily-jp/latest.json
      DAILY_MAIN_RANK_LIMIT: "20"
      DAILY_REFERENCE_LIMIT: "50"
      DAILY_BLOCKED_SCORE_FLOOR: "500"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate render script
        run: |
          set -euo pipefail
          python -m compileall scripts/render_daily_jp.py

      - name: Verify daily JSON exists
        run: |
          set -euo pipefail

          if [ ! -f site/data/daily-jp/latest.json ]; then
            echo "site/data/daily-jp/latest.json does not exist."
            echo "Run Build JP daily signals first."
            exit 1
          fi

      - name: Render JP daily page
        run: |
          set -euo pipefail
          python scripts/render_daily_jp.py

      - name: Verify rendered files
        run: |
          set -euo pipefail

          test -f site/japan/daily/index.html
          test -f site/assets/daily_jp.css

          grep -q "Daily Japan Signals" site/japan/daily/index.html
          grep -q "DAILY JP DECISION BOARD" site/japan/daily/index.html
          grep -q "5-SECOND READ" site/japan/daily/index.html
          grep -q "ACTIONABLE SIGNAL" site/japan/daily/index.html
          grep -q "HIGHEST SCORE" site/japan/daily/index.html
          grep -q "BLOCKED HIGH SCORE" site/japan/daily/index.html
          grep -q "MAIN DAILY BOARD" site/japan/daily/index.html
          grep -q "REFERENCE ONLY" site/japan/daily/index.html
          grep -q "Trade" site/japan/daily/index.html
          grep -q "Watch" site/japan/daily/index.html
          grep -q "Ignore" site/japan/daily/index.html

      - name: Commit rendered daily page
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/japan/daily/index.html site/assets/daily_jp.css

          if git diff --cached --quiet; then
            echo "No rendered daily page changes to commit."
            exit 0
          fi

          git commit -m "Render JP daily decision board"
          git push
