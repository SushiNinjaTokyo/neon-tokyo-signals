name: Render JP daily page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/render_daily_jp.py"
      - "templates/daily_jp.html.j2"
      - "templates/daily_jp.css"
      - "site/data/daily-jp/latest.json"
      - "requirements-render.txt"
      - ".github/workflows/render-daily-jp.yml"

permissions:
  contents: write

concurrency:
  group: render-daily-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-daily:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      DAILY_JSON: site/data/daily-jp/latest.json
      DAILY_MAIN_RANK_LIMIT: 20
      DAILY_REFERENCE_LIMIT: 50
      DAILY_BLOCKED_SCORE_FLOOR: 500
      DAILY_BLOCKED_DISPLAY_LIMIT: 5
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate render script
        run: |
          set -euo pipefail
          python -m compileall scripts/render_daily_jp.py

      - name: Verify daily JSON exists
        run: |
          set -euo pipefail

          if [ ! -f site/data/daily-jp/latest.json ]; then
            echo "site/data/daily-jp/latest.json does not exist."
            echo "Run Build JP daily signals first."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("site/data/daily-jp/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("schema_version") == "daily-jp-v2", data.get("schema_version")
          assert isinstance(data.get("items"), list), "items must be a list"
          assert isinstance(data.get("summary"), dict), "summary must be a dict"
          assert isinstance(data.get("market_pulse"), list), "market_pulse must be a list"

          print("daily schema_version=", data.get("schema_version"))
          print("daily items_count=", len(data.get("items") or []))
          print("daily generated_at=", data.get("generated_at"))
          PY

      - name: Render JP daily page
        run: |
          set -euo pipefail
          python scripts/render_daily_jp.py

      - name: Verify rendered files
        run: |
          set -euo pipefail

          test -f site/japan/daily/index.html
          test -f site/assets/daily_jp.css

          python - <<'PY'
          from pathlib import Path

          html_path = Path("site/japan/daily/index.html")
          css_path = Path("site/assets/daily_jp.css")

          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          assert len(html) > 1000, "daily html is unexpectedly small"
          assert len(css) > 1000, "daily css is unexpectedly small"

          required_html_skeleton = [
              "<!doctype html>",
              "<html",
              "<head>",
              "<body>",
              "</html>",
              "Neon Tokyo Signals",
              "daily_jp.css",
          ]

          for token in required_html_skeleton:
              assert token in html, f"missing stable html skeleton token: {token}"

          forbidden_unrendered_tokens = [
              "{{",
              "{%",
              "%}",
              "UndefinedError",
              "Traceback",
          ]

          for token in forbidden_unrendered_tokens:
              assert token not in html, f"unrendered/error token found in html: {token}"

          required_css_skeleton = [
              ":root",
              "body",
          ]

          for token in required_css_skeleton:
              assert token in css, f"missing stable css skeleton token: {token}"

          print("daily html bytes=", len(html))
          print("daily css bytes=", len(css))
          PY

      - name: Commit rendered daily page
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/japan/daily/index.html site/assets/daily_jp.css

          if git diff --cached --quiet; then
            echo "No rendered daily page changes to commit."
            exit 0
          fi

          git commit -m "Render JP daily page"
          git push
