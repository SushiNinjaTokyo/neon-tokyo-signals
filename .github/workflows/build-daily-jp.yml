name: Build JP daily signals

on:
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: "Fetch fresh JP prices before building daily signals"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - main
    paths:
      - "scripts/build_daily_jp.py"
      - "scripts/fetch_prices_jp.py"
      - "data/universe_jp.csv"
      - "requirements-render.txt"
      - ".github/workflows/build-daily-jp.yml"

permissions:
  contents: write

concurrency:
  group: build-daily-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-daily:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      PRICES_JSON: site/data/prices-jp/latest.json
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate Python scripts
        run: |
          set -euo pipefail
          python -m compileall scripts/build_daily_jp.py scripts/fetch_prices_jp.py

      - name: Optionally fetch fresh JP prices
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.refresh_prices == 'true' }}
        run: |
          set -euo pipefail
          python scripts/fetch_prices_jp.py

      - name: Verify price JSON exists
        run: |
          set -euo pipefail

          if [ ! -f site/data/prices-jp/latest.json ]; then
            echo "site/data/prices-jp/latest.json does not exist."
            echo "Run the Fetch JP prices workflow first."
            exit 1
          fi

      - name: Build JP daily signals
        run: |
          set -euo pipefail
          python scripts/build_daily_jp.py

      - name: Verify generated daily JSON
        run: |
          set -euo pipefail

          test -f site/data/daily-jp/latest.json
          test -f site/data/daily-jp/manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          latest = Path("site/data/daily-jp/latest.json")
          manifest = Path("site/data/daily-jp/manifest.json")

          data = json.loads(latest.read_text(encoding="utf-8"))
          m = json.loads(manifest.read_text(encoding="utf-8"))

          assert data["schema_version"] == "daily-jp-v2", data.get("schema_version")
          assert m["schema_version"] == "daily-jp-manifest-v2", m.get("schema_version")

          assert isinstance(data.get("items"), list)
          assert len(data["items"]) > 0

          assert isinstance(data.get("all_items"), list)
          assert len(data["all_items"]) > 0

          assert isinstance(data.get("market_pulse"), list)
          assert "summary" in data
          assert "methodology" in data
          assert "regime" in data

          summary = data["summary"]

          top = summary.get("top_symbol")
          score = summary.get("top_score")
          score_pts = summary.get("top_score_pts")
          triage = summary.get("top_triage")
          archetype = summary.get("top_archetype")
          classification = summary.get("top_classification")

          assert top, "top_symbol is empty"
          assert triage in {"Trade", "Watch", "Ignore"}, f"unexpected triage: {triage}"

          first = data["items"][0]
          assert "triage" in first
          assert "archetype" in first
          assert "score_pts" in first
          assert "reason" in first
          assert "v2_components" in first

          print("schema_version=", data["schema_version"])
          print("items_count=", len(data["items"]))
          print("all_items_count=", len(data["all_items"]))
          print("regime=", data.get("regime"))
          print("top_symbol=", top)
          print("top_score=", score)
          print("top_score_pts=", score_pts)
          print("top_triage=", triage)
          print("top_archetype=", archetype)
          print("top_classification=", classification)
          PY

      - name: Commit generated daily data
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/data/daily-jp

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.refresh_prices || 'false' }}" = "true" ]; then
            git add -f site/data/prices-jp
          fi

          if git diff --cached --quiet; then
            echo "No generated daily data changes to commit."
            exit 0
          fi

          git commit -m "Build JP daily signals"
          git push
