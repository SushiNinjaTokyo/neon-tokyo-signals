name: Build JP daily signals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/build_daily_jp.py"
      - "scripts/fetch_prices_jp.py"
      - "data/universe_jp.csv"
      - "requirements-render.txt"
      - ".github/workflows/build-daily-jp.yml"

permissions:
  contents: write

concurrency:
  group: build-daily-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-daily:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      PRICES_JSON: site/data/prices-jp/latest.json
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate Python scripts
        run: |
          set -euo pipefail
          python -m compileall scripts/build_daily_jp.py

      - name: Verify price JSON exists
        run: |
          set -euo pipefail

          if [ ! -f site/data/prices-jp/latest.json ]; then
            echo "site/data/prices-jp/latest.json does not exist."
            echo "Run the Fetch JP prices workflow first."
            exit 1
          fi

      - name: Build JP daily signals
        run: |
          set -euo pipefail
          python scripts/build_daily_jp.py

      - name: Verify generated daily JSON
        run: |
          set -euo pipefail

          test -f site/data/daily-jp/latest.json
          test -f site/data/daily-jp/manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          latest = Path("site/data/daily-jp/latest.json")
          manifest = Path("site/data/daily-jp/manifest.json")

          data = json.loads(latest.read_text(encoding="utf-8"))
          m = json.loads(manifest.read_text(encoding="utf-8"))

          assert data["schema_version"] == "daily-jp-v1"
          assert isinstance(data["items"], list)
          assert len(data["items"]) > 0
          assert isinstance(data["market_pulse"], list)
          assert "summary" in data
          assert m["schema_version"] == "daily-jp-manifest-v1"

          top = data["summary"].get("top_symbol")
          score = data["summary"].get("top_score")
          classification = data["summary"].get("top_classification")

          print("items_count=", len(data["items"]))
          print("top_symbol=", top)
          print("top_score=", score)
          print("top_classification=", classification)
          PY

      - name: Commit generated daily data
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/data/daily-jp

          if git diff --cached --quiet; then
            echo "No generated daily data changes to commit."
            exit 0
          fi

          git commit -m "Build JP daily signals"
          git push
