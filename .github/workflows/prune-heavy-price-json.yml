name: Prune heavy price JSON

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletion without committing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      commit_outputs:
        description: "Commit prune result"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUT_DIR: site

concurrency:
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Run price JSON prune
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DELETE_DATED_PRICES_JSON: "true"
          MAX_PRICES_LATEST_MB: "25"
        run: |
          set -euo pipefail
          python scripts/prune_prices_jp_heavy_json.py

      - name: Verify prune result
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          test -f site/data/prices-jp/prune-report.json
          if find site/data/prices-jp -maxdepth 1 -type f -name '20??-??-??.json' | grep -q .; then
            echo "Dated prices-jp JSON still exists"
            find site/data/prices-jp -maxdepth 1 -type f -name '20??-??-??.json' -print
            exit 1
          fi

      - name: Commit prune result
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.commit_outputs != 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data/prices-jp
          if git diff --cached --quiet; then
            echo "No price JSON prune changes to commit."
            exit 0
          fi
          git commit -m "Prune heavy JP price JSON snapshots"
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Fetching origin/main and retrying ($i/3)..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done
          exit 1
