name: Fetch JP prices

on:
  workflow_dispatch:
  schedule:
    # 17:15 JST on weekdays, after Tokyo market close.
    - cron: "15 8 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "scripts/fetch_prices_jp.py"
      - "data/universe_jp.csv"
      - "requirements-render.txt"
      - ".github/workflows/fetch-prices-jp.yml"

permissions:
  contents: write

concurrency:
  group: fetch-prices-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      UNIVERSE_CSV: data/universe_jp.csv
      LOOKBACK_DAYS: "520"
      MIN_BARS_REQUIRED: "60"
      MIN_ACCEPTABLE_BARS: "20"
      REQUEST_SLEEP_SECONDS: "0.25"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate Python script
        run: |
          set -euo pipefail
          python -m compileall scripts/fetch_prices_jp.py

      - name: Fetch JP prices
        run: |
          set -euo pipefail
          python scripts/fetch_prices_jp.py

      - name: Verify generated price JSON
        run: |
          set -euo pipefail

          test -f site/data/prices-jp/latest.json
          test -f site/data/prices-jp/manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          latest = Path("site/data/prices-jp/latest.json")
          manifest = Path("site/data/prices-jp/manifest.json")

          data = json.loads(latest.read_text(encoding="utf-8"))
          m = json.loads(manifest.read_text(encoding="utf-8"))

          assert data["schema_version"] == "prices-jp-v1"
          assert data["symbols_success"] > 0
          assert isinstance(data["items"], list)
          assert isinstance(data["equities"], list)
          assert isinstance(data["market_pulse"], list)
          assert m["schema_version"] == "prices-jp-manifest-v1"

          print("symbols_success=", data["symbols_success"])
          print("symbols_failed=", data["symbols_failed"])
          print("equities_success=", data["equities_success"])
          print("market_pulse_success=", data["market_pulse_success"])
          PY

      - name: Commit generated price data
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/data/prices-jp

          if git diff --cached --quiet; then
            echo "No generated price data changes to commit."
            exit 0
          fi

          git commit -m "Fetch JP price data"
          git push
