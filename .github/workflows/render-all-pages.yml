name: Render AI Arena pages

on:
  workflow_dispatch:
    inputs:
      commit_outputs:
        description: "Commit rendered AI Arena pages"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: render-ai-arena-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: site
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # AI Arena / shared JSON only.
  # Do not reintroduce Daily / Weekly public JSON dependencies here.
  PRICE_JSON: site/data/prices-jp/latest.json
  ARENA_HERO_JSON: site/data/japan/ai-arena/hero/latest.json
  ARENA_SUMMARY_JSON: site/data/japan/ai-arena/summary/latest.json
  ARENA_RANKING_JSON: site/data/japan/ai-arena/ranking/latest.json
  ARENA_POSITIONS_JSON: site/data/japan/ai-arena/positions/latest.json
  ARENA_SIGNALS_JSON: site/data/japan/ai-arena/signals/latest.json
  ARENA_AGENTS_JSON: site/data/japan/ai-arena/agents/latest.json

jobs:
  render-ai-arena-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Compile render scripts
        run: |
          set -euo pipefail
          python -m compileall \
            scripts/render_all.py \
            scripts/render_index.py \
            scripts/render_ai_arena_jp.py \
            scripts/render_ai_arena_summary_jp.py \
            scripts/render_ai_arena_ranking_jp.py \
            scripts/render_ai_arena_positions_jp.py \
            scripts/render_ai_arena_signals_jp.py \
            scripts/render_ai_agent_profiles_jp.py \
            scripts/render_static_pages.py \
            scripts/render_common.py

      - name: Verify AI Arena source JSON files
        run: |
          set -euo pipefail

          required_jsons=(
            "${PRICE_JSON}"
            "${ARENA_HERO_JSON}"
            "${ARENA_SUMMARY_JSON}"
            "${ARENA_RANKING_JSON}"
            "${ARENA_POSITIONS_JSON}"
            "${ARENA_SIGNALS_JSON}"
            "${ARENA_AGENTS_JSON}"
          )

          for json_path in "${required_jsons[@]}"; do
            if [ ! -s "$json_path" ]; then
              echo "::error::Missing required AI Arena JSON: $json_path"
              echo "::error::Run AI Arena JP season rebuild or live update first."
              exit 1
            fi
          done

          python - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "prices": Path("site/data/prices-jp/latest.json"),
              "hero": Path("site/data/japan/ai-arena/hero/latest.json"),
              "summary": Path("site/data/japan/ai-arena/summary/latest.json"),
              "ranking": Path("site/data/japan/ai-arena/ranking/latest.json"),
              "positions": Path("site/data/japan/ai-arena/positions/latest.json"),
              "signals": Path("site/data/japan/ai-arena/signals/latest.json"),
              "agents": Path("site/data/japan/ai-arena/agents/latest.json"),
          }

          for name, path in checks.items():
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict):
                  raise SystemExit(f"{name} JSON must be an object: {path}")
              print(f"json_ok {name} {path} schema={data.get('schema_version')}")

          hero = json.loads(checks["hero"].read_text(encoding="utf-8"))
          if len(hero.get("agents", [])) != 7:
              raise SystemExit(f"hero agents must be 7, got {len(hero.get('agents', []))}")
          if not hero.get("ticker_tape"):
              raise SystemExit("hero ticker_tape is empty")

          prices = json.loads(checks["prices"].read_text(encoding="utf-8"))
          if prices.get("public_json_mode") != "summary":
              raise SystemExit(f"prices-jp must remain summary mode, got {prices.get('public_json_mode')}")
          if prices.get("bars_omitted") is not True:
              raise SystemExit("prices-jp/latest.json must omit bars")
          PY

      - name: Render AI Arena pages
        run: |
          set -euo pipefail
          python scripts/render_all.py

      - name: Verify rendered AI Arena pages
        run: |
          set -euo pipefail

          required_files=(
            "site/index.html"
            "site/assets/base.css"
            "site/assets/index.css"
            "site/japan/ai-arena/index.html"
            "site/japan/ai-arena/summary/index.html"
            "site/japan/ai-arena/ranking/index.html"
            "site/japan/ai-arena/positions/index.html"
            "site/japan/ai-arena/signals/index.html"
            "site/japan/ai-arena/agents/index.html"
            "site/assets/ai_arena_jp.css"
            "site/assets/ai_arena_jp.js"
            "site/assets/ai_arena_summary_jp.css"
            "site/assets/ai_arena_ranking_jp.css"
            "site/assets/ai_arena_positions_jp.css"
            "site/assets/ai_arena_signals_jp.css"
            "site/assets/ai_agent_profiles_jp.css"
            "site/data/japan/ai-arena/agents/latest.json"
            "site/disclaimer/index.html"
            "site/privacy/index.html"
          )

          for f in "${required_files[@]}"; do
            test -s "$f"
          done

          python - <<'PY'
          from pathlib import Path

          files = [
              "site/index.html",
              "site/japan/ai-arena/index.html",
              "site/japan/ai-arena/summary/index.html",
              "site/japan/ai-arena/ranking/index.html",
              "site/japan/ai-arena/positions/index.html",
              "site/japan/ai-arena/signals/index.html",
              "site/japan/ai-arena/agents/index.html",
          ]

          forbidden = ["{{", "{%", "%}", "UndefinedError", "Traceback"]
          required_agents = ["KYOU", "NAGARE", "MAMORU", "SAGURI", "MATSU", "KAESHI", "HIZUMI"]

          for fp in files:
              p = Path(fp)
              text = p.read_text(encoding="utf-8")
              assert len(text) > 1000, f"{fp} is unexpectedly small"
              assert "<html" in text, f"{fp} missing html tag"
              assert "</html>" in text, f"{fp} missing closing html tag"
              for token in forbidden:
                  assert token not in text, f"{fp} contains unrendered/error token: {token}"
              print("verified", fp, len(text))

          for fp in [
              "site/index.html",
              "site/japan/ai-arena/summary/index.html",
              "site/japan/ai-arena/ranking/index.html",
              "site/japan/ai-arena/positions/index.html",
          ]:
              text = Path(fp).read_text(encoding="utf-8")
              for agent in required_agents:
                  assert agent in text, f"{fp} missing {agent}"

          top = Path("site/index.html").read_text(encoding="utf-8")
          assert "Daily and weekly research pages" not in top
          assert "daily-jp/latest.json" not in top
          assert "weekly-jp" not in top.lower()
          PY

      - name: Commit rendered AI Arena pages
        if: ${{ inputs.commit_outputs == 'true' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          paths=(
            "site/index.html"
            "site/assets/base.css"
            "site/assets/index.css"
            "site/japan/ai-arena"
            "site/assets/ai_arena_jp.css"
            "site/assets/ai_arena_jp.js"
            "site/assets/ai_arena_summary_jp.css"
            "site/assets/ai_arena_ranking_jp.css"
            "site/assets/ai_arena_positions_jp.css"
            "site/assets/ai_arena_signals_jp.css"
            "site/assets/ai_agent_profiles_jp.css"
            "site/data/japan/ai-arena/agents/latest.json"
            "site/disclaimer"
            "site/privacy"
          )

          for path in "${paths[@]}"; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            else
              echo "Skip missing and untracked path: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No rendered AI Arena page changes to commit."
            exit 0
          fi

          git commit -m "Render AI Arena pages"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Fetching origin/main and retrying ($i/3)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed. Aborting to avoid overwriting rendered pages."
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done

          echo "Push failed after retries."
          exit 1

      - name: Verify clean working tree
        run: |
          set -euo pipefail

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is still dirty after commit."
            git status --short
            exit 1
          fi
