name: Cleanup legacy Daily Weekly JP artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletion targets without deleting or committing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      scope:
        description: "Cleanup scope. Start with data. Use wider scopes only after AI Arena pages are stable."
        required: true
        default: "data"
        type: choice
        options:
          - "data"
          - "data_and_pages"
          - "data_pages_and_workflows"
      commit_outputs:
        description: "Commit cleanup report and deletions when dry_run=false"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm:
        description: "For dry_run=false, type DELETE_LEGACY_DAILY_WEEKLY_JP"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cleanup-legacy-daily-weekly-jp-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LEGACY_CLEANUP_DRY_RUN: ${{ inputs.dry_run }}
  LEGACY_CLEANUP_SCOPE: ${{ inputs.scope }}

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Sync latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Validate cleanup script
        run: |
          set -euo pipefail
          python -m py_compile scripts/cleanup_legacy_daily_weekly_artifacts_jp.py

      - name: Confirm destructive cleanup
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DELETE_LEGACY_DAILY_WEEKLY_JP" ]; then
            echo "::error::Confirmation text mismatch. Cleanup aborted."
            echo "For dry_run=false, set confirm to DELETE_LEGACY_DAILY_WEEKLY_JP."
            exit 1
          fi

      - name: Preview cleanup targets
        run: |
          set -euo pipefail
          python scripts/cleanup_legacy_daily_weekly_artifacts_jp.py \
            --dry-run \
            --scope "${LEGACY_CLEANUP_SCOPE}"

      - name: Execute cleanup
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          python scripts/cleanup_legacy_daily_weekly_artifacts_jp.py \
            --execute \
            --scope "${LEGACY_CLEANUP_SCOPE}"

      - name: Verify AI Arena and shared outputs still exist
        run: |
          set -euo pipefail

          required_paths=(
            "site/index.html"
            "site/data/prices-jp/latest.json"
            "site/data/japan/ai-arena"
            "site/japan/ai-arena"
            "site/assets/ai_arena_jp.css"
            "site/assets/ai_arena_jp.js"
            "data/agents"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "::error::Required AI Arena/shared path missing after cleanup: $path"
              exit 1
            fi
            echo "verified $path"
          done

          if [ -e "site/data/japan/ai-arena/legacy-cleanup-report.json" ]; then
            python -m json.tool site/data/japan/ai-arena/legacy-cleanup-report.json >/dev/null
            echo "verified site/data/japan/ai-arena/legacy-cleanup-report.json"
          fi

      - name: Commit cleanup changes
        if: ${{ inputs.dry_run == 'false' && inputs.commit_outputs == 'true' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          # Stage only the known legacy deletion targets plus the cleanup report.
          # AI Arena, AI_LAB/discussion/memory outputs, prices latest, DuckDB, and
          # data/agents are intentionally not staged here unless already included
          # in the report path.
          git add -A \
            site/data/backtest-daily-jp \
            site/data/daily-jp \
            site/data/daily-v2-jp \
            site/data/japan/daily \
            site/data/weekly-jp \
            site/data/japan/weekly \
            site/japan/daily \
            site/japan/weekly \
            site/japan/weekly-backtest \
            site/japan/weekly-simulation \
            site/assets/daily_jp.css \
            site/assets/backtest_daily_jp.css \
            site/assets/daily_simulation_jp.css \
            site/assets/weekly_jp.css \
            site/assets/weekly_backtest_jp.css \
            site/assets/weekly_simulation_jp.css \
            .github/workflows/backtest-daily-jp-incremental.yml \
            .github/workflows/backtest-daily-jp-range.yml \
            .github/workflows/build-daily-jp.yml \
            .github/workflows/daily-jp-auto.yml \
            .github/workflows/daily-jp-simulation.yml \
            .github/workflows/render-backtest-daily-jp.yml \
            .github/workflows/render-daily-jp.yml \
            .github/workflows/weekly-jp-analysis.yml \
            .github/workflows/weekly-jp-screening.yml \
            site/data/japan/ai-arena/legacy-cleanup-report.json \
            scripts/cleanup_legacy_daily_weekly_artifacts_jp.py \
            .github/workflows/cleanup-legacy-daily-weekly-jp.yml

          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi

          git commit -m "Cleanup legacy Daily Weekly JP artifacts"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Fetching origin/main and retrying ($i/3)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed. Aborting to avoid overwriting generated files."
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done

          echo "Push failed after retries."
          exit 1

      - name: Show final git status
        run: |
          set -euo pipefail
          git status --short
