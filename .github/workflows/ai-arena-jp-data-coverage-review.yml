name: AI Arena JP data coverage review

on:
  workflow_dispatch:
    inputs:
      fail_on_critical:
        description: "Fail workflow when critical warnings are detected"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      commit_outputs:
        description: "Commit generated data coverage reports"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      min_bars_required:
        description: "Minimum acceptable price bars per symbol"
        required: false
        default: "60"
      stale_price_days:
        description: "Warn when symbol latest price is older than this many days versus latest price date"
        required: false
        default: "5"
      min_fundamental_coverage_pct:
        description: "Minimum acceptable fundamental coverage percentage"
        required: false
        default: "50"

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-arena-jp-data-coverage-review
  cancel-in-progress: false

jobs:
  data-coverage-review:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      PRICE_DUCKDB_PATH: data/cache/neon_tokyo_jp.duckdb
      MIN_BARS_REQUIRED: ${{ github.event.inputs.min_bars_required || '60' }}
      STALE_PRICE_DAYS: ${{ github.event.inputs.stale_price_days || '5' }}
      MIN_FUNDAMENTAL_COVERAGE_PCT: ${{ github.event.inputs.min_fundamental_coverage_pct || '50' }}
      FAIL_ON_CRITICAL: ${{ github.event.inputs.fail_on_critical || 'false' }}
      CANONICAL_DUCKDB_RELEASE_TAG: ai-arena-duckdb-latest
      CANONICAL_DUCKDB_ASSET: neon_tokyo_jp_latest.duckdb.zst
      CANONICAL_DUCKDB_MANIFEST_ASSET: neon_tokyo_jp_latest_manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Download canonical DuckDB from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/cache

          if ! gh release view "${CANONICAL_DUCKDB_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Canonical DuckDB release not found: ${CANONICAL_DUCKDB_RELEASE_TAG}"
            echo "::error::Run AI Arena JP season rebuild first."
            exit 1
          fi

          gh release download "${CANONICAL_DUCKDB_RELEASE_TAG}" \
            --pattern "${CANONICAL_DUCKDB_ASSET}" \
            --dir data/cache \
            --clobber

          gh release download "${CANONICAL_DUCKDB_RELEASE_TAG}" \
            --pattern "${CANONICAL_DUCKDB_MANIFEST_ASSET}" \
            --dir data/cache \
            --clobber || true

          test -f "data/cache/${CANONICAL_DUCKDB_ASSET}"
          zstd -d -f "data/cache/${CANONICAL_DUCKDB_ASSET}" -o "${PRICE_DUCKDB_PATH}"
          test -f "${PRICE_DUCKDB_PATH}"
          ls -lh "${PRICE_DUCKDB_PATH}"

      - name: Show canonical DB status
        run: |
          set -euo pipefail
          python scripts/show_duckdb_build_metadata.py --db-path "${PRICE_DUCKDB_PATH}" --fail-if-missing

      - name: Compile data coverage script
        run: |
          set -euo pipefail
          python -m compileall \
            scripts/review_data_coverage_jp.py \
            scripts/show_duckdb_build_metadata.py \
            scripts/lib

      - name: Run data coverage review
        run: |
          set -euo pipefail
          python scripts/review_data_coverage_jp.py

      - name: Validate data coverage outputs
        run: |
          set -euo pipefail
          test -s site/data/japan/ai-arena/diagnostics/data-coverage-latest.json
          test -s site/data/japan/ai-arena/diagnostics/data-coverage-latest.md

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("site/data/japan/ai-arena/diagnostics/data-coverage-latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          schema_version = str(data.get("schema_version", ""))
          if not schema_version.startswith("neon_tokyo_data_coverage_review_v"):
              raise SystemExit(f"Unexpected data coverage schema_version: {schema_version}")

          warnings = data.get("warnings")
          if not isinstance(warnings, list):
              raise SystemExit("data coverage output must contain warnings[]")

          print("data_coverage_schema_ok")
          print("schema_version=", schema_version)
          print("warnings=", len(warnings))

          fail_on_critical = str(os.getenv("FAIL_ON_CRITICAL", "false")).lower() == "true"
          criticals = [
              w for w in warnings
              if str(w.get("severity", "")).lower() == "critical"
          ]

          print("criticals=", len(criticals))

          if criticals:
              for w in criticals[:30]:
                  print("critical:", w.get("code"), w.get("message"))

          if fail_on_critical and criticals:
              raise SystemExit(1)
          PY

      - name: Commit data coverage reports
        if: ${{ github.event.inputs.commit_outputs != 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -A \
            site/data/japan/ai-arena/diagnostics/data-coverage-latest.json \
            site/data/japan/ai-arena/diagnostics/data-coverage-latest.md \
            site/data/japan/ai-arena/diagnostics/latest-data-coverage.json \
            site/data/japan/ai-arena/diagnostics/latest-data-coverage.md

          if git diff --cached --quiet; then
            echo "No data coverage report changes to commit."
            exit 0
          fi

          git commit -m "Update AI Arena data coverage review"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Fetching origin/main and retrying ($i/3)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed. Aborting to avoid overwriting generated reports."
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done

          echo "Push failed after retries."
          exit 1
