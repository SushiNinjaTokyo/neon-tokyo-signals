name: AI Arena JP live update

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year"
        required: true
        default: "2026"
      commit_outputs:
        description: "Commit generated outputs"
        required: true
        default: "true"
  # Enable after manual verification:
  # schedule:
  #   - cron: "30 10 * * 1-5"  # 19:30 JST on weekdays

permissions:
  contents: write

concurrency:
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUT_DIR: site
  PRICE_DUCKDB_PATH: data/cache/neon_tokyo_jp.duckdb
  PRICE_STORE_MODE: json_and_duckdb
  PRICE_PUBLIC_JSON_MODE: summary
  WRITE_DATED_PRICE_JSON: "false"
  AGENT_SCORE_MIN_DATE_COVERAGE_PCT: 70
  AGENT_SCORE_TOP_N: 30

jobs:
  live-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: data/cache/neon_tokyo_jp.duckdb
          key: neon-tokyo-jp-duckdb-v2-live
          restore-keys: |
            neon-tokyo-jp-duckdb-v2-
            neon-tokyo-jp-duckdb-v1
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
      - name: Generate live season outputs
        env:
          ARENA_YEAR: ${{ inputs.year }}
          START_DATE: ${{ inputs.year }}-01-01
          RUN_MODE: live
          RESET_RUN: true
          PROMOTE_DISPLAY_RUN: true
          FORCE_FINALIZE_SEASON: false
          ENABLE_GPT_SIGNAL_NOTES: false
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          if [ ! -f data/universe/jp_duckdb_trial_300.csv ]; then
            if [ ! -f data/universe/jp_index_universe.csv ]; then python scripts/build_jp_index_universe_csv.py; fi
            OUT_UNIVERSE_CSV=data/universe/jp_duckdb_trial_300.csv STRICT_INDEX_UNIVERSE=true python scripts/build_universe_300_from_index_csv.py
          fi
          UNIVERSE_CSV=data/universe/jp_duckdb_trial_300.csv UNIVERSE_LIMIT=300 LOOKBACK_DAYS=720 python scripts/fetch_prices_jp.py
          FUNDAMENTALS_LIMIT=300 python scripts/fetch_fundamentals_jp.py
          AGENT_SCORE_MODE=range AGENT_SCORE_START_DATE=${{ inputs.year }}-01-01 python scripts/build_agent_scores_jp.py
          python scripts/rebuild_ai_arena_season_from_duckdb_jp.py
          python scripts/build_ai_arena_signals_jp.py
          python scripts/render_ai_agent_profiles_jp.py
          python scripts/render_ai_arena_summary_jp.py
          python scripts/render_ai_arena_signals_jp.py
          python scripts/build_ai_arena_log_from_duckdb_jp.py
          python scripts/prune_ai_arena_generated_artifacts.py
      - name: Commit outputs
        if: ${{ inputs.commit_outputs == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data site/japan/ai-arena site/assets/ai_agent_profiles_jp.css site/assets/ai_arena_summary_jp.css site/assets/ai_arena_signals_jp.css data/universe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update AI Arena JP live season"
          git push origin HEAD:main
