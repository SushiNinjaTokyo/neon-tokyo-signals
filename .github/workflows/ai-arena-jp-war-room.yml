name: AI Arena JP War Room

on:
  workflow_dispatch:
    inputs:
      session_type:
        description: "Council session type"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - open_council
          - midday_council
          - close_council
          - night_strategy_lab
          - weekly_arena_review
      data_mode:
        description: "Data mode. refresh_then_build updates prices/ranking before GPT; build_only preserves existing Arena JSON."
        required: false
        default: "build_only"
        type: choice
        options:
          - build_only
          - refresh_then_build
      price_refresh_mode:
        description: "Price refresh mode used only when data_mode=refresh_then_build"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - missing
          - full
      stooq_fallback_enabled:
        description: "Enable Stooq fallback. Keep false for scheduled live sessions."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      commit_outputs:
        description: "Commit generated War Room outputs"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "35 0 * * 1-5"   # 09:35 JST weekdays: Open Council; offset to avoid market-open API bursts
    - cron: "5 3 * * 1-5"    # 12:05 JST weekdays: Midday Council
    - cron: "40 6 * * 1-5"   # 15:40 JST weekdays: Post-Close Council
    - cron: "45 11 * * 1-5"  # 20:45 JST weekdays: Night Strategy Lab
    - cron: "10 1 * * 6"     # 10:10 JST Saturdays: Weekly Arena Review

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-arena-jp-canonical-db
  cancel-in-progress: false

jobs:
  war-room:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      OUT_DIR: site
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WAR_ROOM_DATA_MODE: ${{ github.event_name == 'schedule' && 'refresh_then_build' || github.event.inputs.data_mode || 'build_only' }}
      PRICE_DUCKDB_PATH: data/cache/neon_tokyo_jp.duckdb
      PRICE_STORE_MODE: json_and_duckdb
      PRICE_FETCH_MODE: live
      PRICE_REFRESH_MODE: ${{ github.event.inputs.price_refresh_mode || 'incremental' }}
      STOOQ_FALLBACK_ENABLED: ${{ github.event.inputs.stooq_fallback_enabled || 'false' }}
      STOOQ_TIMEOUT_SECONDS: "3"
      YFINANCE_TIMEOUT_SECONDS: "10"
      PRICE_FETCH_SLEEP_SECONDS: "0.05"
      PRICE_MAX_STALE_CALENDAR_DAYS: "3"
      UNIVERSE_LIMIT: "1000"
      OUT_UNIVERSE_CSV: data/universe/jp_duckdb_trial_300.csv
      MANUAL_THEME_INCLUDE_CSV: data/universe/jp_manual_theme_includes.csv
      UNIVERSE_DIAGNOSTICS_JSON: site/data/japan/universe/jp_duckdb_trial_300_diagnostics.json
      STRICT_INDEX_UNIVERSE: "true"
      LOOKBACK_DAYS: "520"
      MIN_BARS_REQUIRED: "60"
      MIN_ACCEPTABLE_BARS: "20"
      AGENT_SCORE_TOP_N: "30"
      AI_ARENA_YEAR: "auto"
      AI_ARENA_RUN_MODE: live
      AI_ARENA_RESET_RUN: "true"
      AI_ARENA_PROMOTE_DISPLAY_RUN: "true"
      AI_ARENA_ENABLE_GPT_SIGNAL_NOTES: "false"
      FORCE_FINALIZE_SEASON: "false"
      VALUE_FEATURE_YEAR: auto
      VALUE_FEATURE_START_DATE: ""
      VALUE_FEATURE_END_DATE: ""
      AGENT_SCORE_MODE: range
      AGENT_SCORE_YEAR: auto
      AGENT_SCORE_START_DATE: auto
      AGENT_SCORE_END_DATE: auto
      AGENT_SCORE_FAIL_IF_RANGE_TOO_SMALL: "true"
      AI_ARENA_FAIL_IF_NO_ORDERS: "true"
      AI_ARENA_WAR_ROOM_MODEL: ${{ vars.AI_ARENA_WAR_ROOM_MODEL || 'gpt-4o' }}
      AI_ARENA_WAR_ROOM_SESSION_TYPE: ${{ github.event.inputs.session_type || 'auto' }}
      AI_ARENA_WAR_ROOM_MESSAGES: ${{ vars.AI_ARENA_WAR_ROOM_MESSAGES }}
      AI_ARENA_WAR_ROOM_MIN_DELAY_SECONDS: "180"
      AI_ARENA_WAR_ROOM_MAX_DELAY_SECONDS: "300"
      AI_ARENA_WAR_ROOM_TEMPERATURE: ${{ vars.AI_ARENA_WAR_ROOM_TEMPERATURE || '0.86' }}
      AI_ARENA_WAR_ROOM_HISTORY_DAYS: "14"
      AI_ARENA_WAR_ROOM_OPENAI_MIN_INTERVAL_SECONDS: ${{ vars.AI_ARENA_WAR_ROOM_OPENAI_MIN_INTERVAL_SECONDS || '30' }}
      AI_ARENA_WAR_ROOM_OPENAI_MAX_RETRIES: ${{ vars.AI_ARENA_WAR_ROOM_OPENAI_MAX_RETRIES || '8' }}
      AI_ARENA_WAR_ROOM_OPENAI_429_BASE_SLEEP_SECONDS: ${{ vars.AI_ARENA_WAR_ROOM_OPENAI_429_BASE_SLEEP_SECONDS || '75' }}
      AI_ARENA_WAR_ROOM_MARKET_CONTEXT: ${{ vars.AI_ARENA_WAR_ROOM_MARKET_CONTEXT || 'true' }}
      AI_ARENA_MARKET_CONTEXT_TIMEOUT_SECONDS: "8"
      CANONICAL_DUCKDB_RELEASE_TAG: ai-arena-duckdb-latest
      CANONICAL_DUCKDB_ASSET: neon_tokyo_jp_latest.duckdb.zst
      CANONICAL_DUCKDB_MANIFEST_ASSET: neon_tokyo_jp_latest_manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Compile War Room and data pipeline scripts
        run: |
          set -euo pipefail
          python -m compileall \
            scripts/fetch_prices_jp.py \
            scripts/export_prices_public_json_jp.py \
            scripts/build_value_features_jp.py \
            scripts/build_agent_scores_jp.py \
            scripts/rebuild_ai_arena_season_from_duckdb_jp.py \
            scripts/build_ai_arena_war_room_jp.py \
            scripts/render_ai_arena_war_room_jp.py \
            scripts/render_all.py \
            scripts/lib

      - name: Download canonical DuckDB from Release
        if: ${{ env.WAR_ROOM_DATA_MODE == 'refresh_then_build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/cache
          if ! gh release view "${CANONICAL_DUCKDB_RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Canonical DuckDB release not found: ${CANONICAL_DUCKDB_RELEASE_TAG}"
            exit 1
          fi
          gh release download "${CANONICAL_DUCKDB_RELEASE_TAG}" --pattern "${CANONICAL_DUCKDB_ASSET}" --dir data/cache --clobber
          gh release download "${CANONICAL_DUCKDB_RELEASE_TAG}" --pattern "${CANONICAL_DUCKDB_MANIFEST_ASSET}" --dir data/cache --clobber || true
          zstd -d -f "data/cache/${CANONICAL_DUCKDB_ASSET}" -o "${PRICE_DUCKDB_PATH}"
          test -f "${PRICE_DUCKDB_PATH}"

      - name: Refresh prices and rebuild Arena context
        if: ${{ env.WAR_ROOM_DATA_MODE == 'refresh_then_build' }}
        run: |
          set -euo pipefail
          if [ ! -f data/universe/jp_index_universe.csv ]; then
            python scripts/build_jp_index_universe_csv.py
          fi
          python scripts/build_universe_300_from_index_csv.py
          python scripts/fetch_prices_jp.py
          python scripts/export_prices_public_json_jp.py
          python scripts/build_value_features_jp.py
          python scripts/build_agent_scores_jp.py
          python scripts/rebuild_ai_arena_season_from_duckdb_jp.py

      - name: Build and render War Room
        run: |
          set -euo pipefail
          python scripts/build_ai_arena_war_room_jp.py
          python scripts/render_all.py
          test -s site/data/japan/ai-arena/war-room/latest.json
          test -s site/japan/ai-arena/log/index.html
          test -s site/assets/ai_arena_war_room_jp.css
          test -s site/assets/ai_arena_war_room_jp.js

      - name: Validate War Room freshness and UI guardrails
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('site/data/japan/ai-arena/war-room/latest.json').read_text(encoding='utf-8'))
          assert payload.get('live_messages') or payload.get('feed'), 'War Room has no messages'
          freshness = payload.get('data_freshness') or {}
          assert freshness.get('level') in {'fresh', 'delayed', 'stale'}, freshness
          html = Path('site/japan/ai-arena/log/index.html').read_text(encoding='utf-8')
          js = Path('site/assets/ai_arena_war_room_jp.js').read_text(encoding='utf-8')
          assert 'data-reveal-all' not in html, 'Reveal-all control must not exist'
          assert 'Fast preview' not in html, 'Fast preview control must not exist'
          assert 'data-reveal-all' not in js, 'Reveal-all JS must not exist'
          assert 'Global reveal queue' in html
          print('war_room_validation_ok', freshness.get('level'))
          PY

      - name: Stamp canonical DuckDB metadata
        if: ${{ env.WAR_ROOM_DATA_MODE == 'refresh_then_build' }}
        run: |
          set -euo pipefail
          python scripts/stamp_duckdb_build_metadata.py \
            --db-path "${PRICE_DUCKDB_PATH}" \
            --source-workflow "${GITHUB_WORKFLOW}" \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-sha "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --release-tag "${CANONICAL_DUCKDB_RELEASE_TAG}" \
            --asset-name "${CANONICAL_DUCKDB_ASSET}" \
            --manifest-path "data/cache/${CANONICAL_DUCKDB_MANIFEST_ASSET}"

      - name: Publish canonical DuckDB Release asset
        if: ${{ env.WAR_ROOM_DATA_MODE == 'refresh_then_build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zstd -T0 -19 -f "${PRICE_DUCKDB_PATH}" -o "data/cache/${CANONICAL_DUCKDB_ASSET}"
          gh release upload "${CANONICAL_DUCKDB_RELEASE_TAG}" \
            "data/cache/${CANONICAL_DUCKDB_ASSET}" \
            "data/cache/${CANONICAL_DUCKDB_MANIFEST_ASSET}" \
            --clobber

      - name: Commit War Room outputs
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit_outputs != 'false' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/universe/jp_duckdb_trial_300.csv \
            site/data/japan/universe \
            site/data/prices-jp \
            site/data/japan/agent-scores \
            site/data/japan/ai-arena \
            site/index.html \
            site/japan/ai-arena \
            site/assets
          if git diff --cached --quiet; then
            echo "No War Room changes to commit."
            exit 0
          fi
          git commit -m "Update AI Arena Live Lab"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Fetching origin/main and retrying ($i/5)..."
            git fetch origin main
            git reset --hard HEAD
            git clean -fd
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              git status --short || true
              exit 1
            fi
            sleep $((5 * i))
          done
          echo "Push failed after retries."
          exit 1
