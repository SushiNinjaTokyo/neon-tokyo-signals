name: AI Arena JP Trade Diagnostics

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID to diagnose. Use display for the currently promoted run."
        required: false
        default: "display"
      allow_fallback:
        description: "Allow fallback to all trades if run_id has no trades. Keep false for real analysis."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  trade-diagnostics:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OUT_DIR: site
      PRICE_DUCKDB_PATH: data/cache/neon_tokyo_jp.duckdb
      CANONICAL_DUCKDB_RELEASE_TAG: ai-arena-duckdb-latest
      CANONICAL_DUCKDB_ASSET: neon_tokyo_jp_latest.duckdb.zst
      CANONICAL_DUCKDB_MANIFEST_ASSET: neon_tokyo_jp_latest_manifest.json
      TRADE_DIAGNOSTICS_RUN_ID: ${{ inputs.run_id }}
      TRADE_DIAGNOSTICS_MAX_TRADE_ROWS: "1500"
      TRADE_DIAGNOSTICS_TOP_N: "15"
      TRADE_DIAGNOSTICS_INCLUDE_CONTEXT: "true"
      TRADE_DIAGNOSTICS_FAIL_IF_NO_TRADES: "true"
      TRADE_DIAGNOSTICS_ALLOW_FALLBACK: ${{ inputs.allow_fallback }}
      TRADE_DIAGNOSTICS_FAIL_ON_DATA_QUALITY: "true"
      TRADE_DIAGNOSTICS_STRICT_DISPLAY_RESOLUTION: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Restore canonical DuckDB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/cache
          gh release download "${CANONICAL_DUCKDB_RELEASE_TAG}" --pattern "${CANONICAL_DUCKDB_ASSET}" --dir data/cache --clobber
          zstd -d -f "data/cache/${CANONICAL_DUCKDB_ASSET}" -o "${PRICE_DUCKDB_PATH}"
          test -s "${PRICE_DUCKDB_PATH}"
          ls -lh "${PRICE_DUCKDB_PATH}"

      - name: Compile diagnostics script
        run: |
          set -euo pipefail
          python -m py_compile scripts/export_ai_arena_trade_diagnostics_jp.py

      - name: Export trade diagnostics
        run: |
          set -euo pipefail
          python scripts/export_ai_arena_trade_diagnostics_jp.py

      - name: Validate trade diagnostics output
        run: |
          set -euo pipefail
          test -s site/data/japan/ai-arena/diagnostics/trade-diagnostics/latest.json
          test -s site/data/japan/ai-arena/diagnostics/trade-diagnostics/latest.md

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("site/data/japan/ai-arena/diagnostics/trade-diagnostics/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("schema_version") == "neon_tokyo_ai_arena_trade_diagnostics_v2", data.get("schema_version")
          assert data.get("compat_schema_version") == "neon_tokyo_ai_arena_trade_diagnostics_v1"

          rr = data.get("run_resolution") or {}
          assert rr.get("used_run_id_filter") is True, rr
          assert rr.get("fallback_used") is False, rr
          assert data.get("effective_run_id"), "effective_run_id is empty"

          counts = data.get("counts") or {}
          assert int(counts.get("closed_trades") or 0) > 0, counts
          assert int(counts.get("agent_summaries") or 0) == 7, counts

          quality = data.get("quality") or {}
          assert quality.get("status") in {"ok", "warning"}, quality
          assert not quality.get("issues"), quality

          summaries = data.get("agent_summaries") or {}
          required = ["daily_striker", "weekly_sage", "risk_sentinel", "discovery_scout", "contrarian_monk", "reversal_snapback", "value_mispricing"]
          for aid in required:
              assert aid in summaries, f"missing summary: {aid}"

          # Guard against the exact broken output that caused the issue:
          # all returns/MFE/MAE zero and all exits UNKNOWN.
          trades = data.get("trades") or []
          assert any(abs(float(t.get("realized_return_pct") or 0)) > 0.000001 for t in trades), "all returns are zero"
          assert any(abs(float(t.get("mfe_pct") or 0)) > 0.000001 for t in trades), "all MFE values are zero"
          assert any(abs(float(t.get("mae_pct") or 0)) > 0.000001 for t in trades), "all MAE values are zero"
          assert any(str(t.get("exit_reason_code") or "UNKNOWN") != "UNKNOWN" for t in trades), "all exit reasons are UNKNOWN"

          md = Path("site/data/japan/ai-arena/diagnostics/trade-diagnostics/latest.md").read_text(encoding="utf-8")
          for token in ["KYOU", "NAGARE", "MAMORU", "SAGURI", "MATSU", "KAESHI", "HIZUMI"]:
              assert token in md, f"Markdown missing agent token: {token}"

          print("trade_diagnostics_v2_validation_ok")
          print("effective_run_id=", data.get("effective_run_id"))
          print("closed_trades=", counts.get("closed_trades"))
          PY

      - name: Commit diagnostics output
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data/japan/ai-arena/diagnostics/trade-diagnostics
          if git diff --cached --quiet; then
            echo "No diagnostics output changes."
            exit 0
          fi
          git commit -m "Fix AI Arena JP trade diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
