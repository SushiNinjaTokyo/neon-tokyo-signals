name: AI Arena JP

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "full = simulation + discussion + render, render_only = render from existing JSON"
        required: true
        default: "full"
        type: choice
        options: [full, render_only]
      enable_ai:
        description: "Use OpenAI API for Market Master / Debate text"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      start_date:
        description: "Optional simulation start date YYYY-MM-DD"
        required: false
        default: ""
      end_date:
        description: "Optional simulation end date YYYY-MM-DD"
        required: false
        default: ""
      lookback_days:
        description: "Used when start_date is blank"
        required: false
        default: "90"
  workflow_run:
    workflows: ["Daily JP auto pipeline"]
    types: [completed]

permissions:
  contents: write

concurrency:
  # All workflows that commit generated site/ artifacts should share this group.
  # This prevents concurrent scheduled runs from racing and producing rejected pushes.
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ai-arena-jp:
    # Run automatically only when the upstream Daily pipeline actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      OUT_DIR: site
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      OPENAI_ENABLE_AI: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_ai || 'true' }}
      OPENAI_MODEL_MINI: ${{ vars.OPENAI_MODEL_MINI || 'gpt-4o-mini' }}
      OPENAI_DAILY_USD_LIMIT: ${{ vars.OPENAI_DAILY_USD_LIMIT || '0.50' }}
      OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '6000' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_ARENA_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '90' }}
      AI_ARENA_START_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.start_date || '' }}
      AI_ARENA_END_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.end_date || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate AI Arena scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/rebuild_ai_arena_simulation_jp.py \
            scripts/build_ai_arena_discussion_jp.py \
            scripts/render_ai_arena_jp.py \
            scripts/render_ai_arena_positions_jp.py \
            scripts/render_ai_arena_ranking_jp.py \
            scripts/render_index.py

      - name: Verify source data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full' }}
        run: |
          set -euo pipefail
          required=(
            "site/data/prices-jp/latest.json"
            "site/data/daily-jp"
            "data/ai_arena_agents_jp.yml"
          )
          for p in "${required[@]}"; do
            if [ ! -e "$p" ]; then
              echo "::error::Missing required AI Arena input: $p"
              exit 1
            fi
          done

      - name: Rebuild AI Arena simulation
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full' }}
        run: |
          set -euo pipefail
          python scripts/rebuild_ai_arena_simulation_jp.py

      - name: Build AI Arena discussion
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_mode == 'full' }}
        run: |
          set -euo pipefail
          python scripts/build_ai_arena_discussion_jp.py

      - name: Verify existing JSON for render only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'render_only' }}
        run: |
          set -euo pipefail
          test -f site/data/japan/ai-arena/discussion/latest.json
          test -f site/data/japan/ai-arena/positions/latest.json
          test -f site/data/japan/ai-arena/ranking/latest.json

      - name: Render AI Arena pages
        run: |
          set -euo pipefail
          python scripts/render_ai_arena_jp.py
          python scripts/render_ai_arena_positions_jp.py
          python scripts/render_ai_arena_ranking_jp.py
          python scripts/render_index.py

      - name: Verify rendered AI Arena pages
        run: |
          set -euo pipefail
          required_files=(
            "site/data/japan/ai-arena/simulation/latest.json"
            "site/data/japan/ai-arena/discussion/latest.json"
            "site/data/japan/ai-arena/positions/latest.json"
            "site/data/japan/ai-arena/ranking/latest.json"
            "site/japan/ai-arena/index.html"
            "site/japan/ai-arena/positions/index.html"
            "site/japan/ai-arena/ranking/index.html"
            "site/assets/ai_arena_jp.css"
            "site/assets/ai_arena_jp.js"
            "site/assets/ai_arena_positions_jp.css"
            "site/assets/ai_arena_ranking_jp.css"
          )
          for f in "${required_files[@]}"; do
            test -f "$f"
          done
          python - <<'PY'
          from pathlib import Path
          for p in [Path('site/japan/ai-arena/index.html'), Path('site/japan/ai-arena/positions/index.html'), Path('site/japan/ai-arena/ranking/index.html')]:
              html = p.read_text(encoding='utf-8')
              assert '<html' in html and '</html>' in html
              for token in ['{{', '{%', 'UndefinedError', 'Traceback']:
                  assert token not in html, f'{p} contains {token}'
              print('verified', p, len(html))
          PY

      - name: Commit AI Arena files
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          paths=(
            "site/data/japan/ai-arena"
            "site/japan/ai-arena"
            "site/assets/ai_arena_jp.css"
            "site/assets/ai_arena_jp.js"
            "site/assets/ai_arena_positions_jp.css"
            "site/assets/ai_arena_ranking_jp.css"
            "site/index.html"
            "site/assets/index.css"
          )
          for path in "${paths[@]}"; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            else
              echo "Skip missing and untracked path: $path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No AI Arena changes to commit."
            exit 0
          fi
          git commit -m "Build AI Arena simulation pages"
          git pull --rebase origin main
          git push origin main

      - name: Verify clean working tree
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Working tree is dirty after AI Arena commit."
            exit 1
          fi
