name: AI Arena JP promote run

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Season year"
        required: true
        default: "2026"
      run_id:
        description: "Existing run_id to promote"
        required: true
      commit_outputs:
        description: "Commit regenerated display JSON"
        required: true
        default: "true"

permissions:
  contents: write

concurrency:
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUT_DIR: site
  PRICE_DUCKDB_PATH: data/cache/neon_tokyo_jp.duckdb

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: data/cache/neon_tokyo_jp.duckdb
          key: neon-tokyo-jp-duckdb-v2-live
          restore-keys: |
            neon-tokyo-jp-duckdb-v2-
            neon-tokyo-jp-duckdb-v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
      - name: Promote run
        env:
          ARENA_YEAR: ${{ inputs.year }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          python scripts/promote_ai_arena_run_jp.py
          python scripts/render_ai_arena_summary_jp.py
      - name: Commit outputs
        if: ${{ inputs.commit_outputs == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data/japan/ai-arena site/japan/ai-arena/summary
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote AI Arena JP run"
          git push origin HEAD:main
