name: Render JP daily backtest page

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/render_backtest_daily_jp.py"
      - "templates/backtest_daily_jp.html.j2"
      - "templates/backtest_daily_jp.css"
      - "site/data/backtest-daily-jp/latest.json"
      - "requirements-render.txt"
      - ".github/workflows/render-backtest-daily-jp.yml"

permissions:
  contents: write

concurrency:
  group: render-backtest-daily-jp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-backtest:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      BACKTEST_JSON: site/data/backtest-daily-jp/latest.json
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate render script
        run: |
          set -euo pipefail
          python -m compileall scripts/render_backtest_daily_jp.py

      - name: Verify backtest JSON exists
        run: |
          set -euo pipefail

          if [ ! -f site/data/backtest-daily-jp/latest.json ]; then
            echo "site/data/backtest-daily-jp/latest.json does not exist."
            echo "Run Backtest JP daily range first."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("site/data/backtest-daily-jp/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("schema_version") == "backtest-daily-jp-v1", data.get("schema_version")
          assert isinstance(data.get("summary"), dict), "summary must be a dict"
          assert "range" in data, "range missing"
          assert "horizons" in data, "horizons missing"

          print("backtest schema_version=", data.get("schema_version"))
          print("backtest generated_at=", data.get("generated_at"))
          print("backtest range=", data.get("range"))
          PY

      - name: Render JP daily backtest page
        run: |
          set -euo pipefail
          python scripts/render_backtest_daily_jp.py

      - name: Verify rendered files
        run: |
          set -euo pipefail

          test -f site/japan/daily/backtest/index.html
          test -f site/assets/backtest_daily_jp.css

          python - <<'PY'
          from pathlib import Path

          html_path = Path("site/japan/daily/backtest/index.html")
          css_path = Path("site/assets/backtest_daily_jp.css")

          html = html_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          assert len(html) > 1000, "backtest html is unexpectedly small"
          assert len(css) > 1000, "backtest css is unexpectedly small"

          required_html_skeleton = [
              "<!doctype html>",
              "<html",
              "<head>",
              "<body>",
              "</html>",
              "Neon Tokyo Signals",
              "backtest_daily_jp.css",
          ]

          for token in required_html_skeleton:
              assert token in html, f"missing stable html skeleton token: {token}"

          forbidden_unrendered_tokens = [
              "{{",
              "{%",
              "%}",
              "UndefinedError",
              "Traceback",
          ]

          for token in forbidden_unrendered_tokens:
              assert token not in html, f"unrendered/error token found in html: {token}"

          required_css_skeleton = [
              ":root",
              "body",
          ]

          for token in required_css_skeleton:
              assert token in css, f"missing stable css skeleton token: {token}"

          print("backtest html bytes=", len(html))
          print("backtest css bytes=", len(css))
          PY

      - name: Commit rendered backtest page
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site/japan/daily/backtest/index.html site/assets/backtest_daily_jp.css

          if git diff --cached --quiet; then
            echo "No rendered backtest page changes to commit."
            exit 0
          fi

          git commit -m "Render JP daily backtest page"
          git push
