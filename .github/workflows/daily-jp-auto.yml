name: Daily JP auto pipeline

on:
  workflow_dispatch:
    inputs:
      fetch_data:
        description: "Fetch fresh JP prices before rebuilding Daily pages"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_backtest:
        description: "Run incremental Daily backtest"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_simulation:
        description: "Run Daily simulation"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # 18:45 JST on Tokyo market weekdays, after the 17:15 JST price fetch window.
    - cron: "45 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-jp-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-auto:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      PRICES_JSON: site/data/prices-jp/latest.json
      DAILY_JSON: site/data/daily-jp/latest.json
      BACKTEST_MODE: incremental
      BACKTEST_HORIZONS: "1,3,5,10,20"
      BACKTEST_PRIMARY_HORIZON: "5"
      BACKTEST_CORE_HORIZONS: "1,3,5,10"
      BACKTEST_REFERENCE_HORIZONS: "20"
      BACKTEST_MIN_HISTORY_BARS: "80"
      BACKTEST_RANK_LIMIT: "10"
      BACKTEST_MAX_RANK_LIMIT: "10"
      BACKTEST_MAX_EVAL_DATES: "30"
      BACKTEST_BENCHMARK_RETURN_ABS_LIMIT_PCT: "30"
      DAILY_JP_SIM_DAYS: "220"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate Python scripts
        run: |
          set -euo pipefail
          python -m compileall \
            scripts/fetch_prices_jp.py \
            scripts/build_daily_jp.py \
            scripts/render_daily_jp.py \
            scripts/backtest_daily_jp.py \
            scripts/render_backtest_daily_jp.py \
            scripts/rebuild_daily_simulation_jp.py \
            scripts/render_daily_simulation_jp.py \
            scripts/render_index.py

      - name: Optionally fetch fresh JP prices
        if: ${{ github.event_name == 'schedule' || github.event.inputs.fetch_data == 'true' }}
        run: |
          set -euo pipefail
          python scripts/fetch_prices_jp.py

      - name: Build Daily JP signals
        run: |
          set -euo pipefail
          python scripts/build_daily_jp.py

      - name: Render Daily JP page
        run: |
          set -euo pipefail
          python scripts/render_daily_jp.py

      - name: Incremental Daily JP backtest
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_backtest == 'true' }}
        run: |
          set -euo pipefail
          python scripts/backtest_daily_jp.py
          python scripts/render_backtest_daily_jp.py

      - name: Rebuild Daily JP simulation
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_simulation == 'true' }}
        run: |
          set -euo pipefail
          python scripts/rebuild_daily_simulation_jp.py
          python scripts/render_daily_simulation_jp.py

      - name: Render index
        run: |
          set -euo pipefail
          python scripts/render_index.py

      - name: Verify generated outputs
        run: |
          set -euo pipefail

          test -f site/japan/daily/index.html
          test -f site/data/daily-jp/latest.json
          test -f site/index.html

          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.run_simulation || 'true' }}" = "true" ]; then
            test -f site/japan/daily/simulation/index.html
            test -f site/data/japan/daily/simulation/latest.json
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          daily = json.loads(Path("site/data/daily-jp/latest.json").read_text(encoding="utf-8"))
          assert daily.get("schema_version") == "daily-jp-v2"
          assert isinstance(daily.get("items"), list)

          sim_path = Path("site/data/japan/daily/simulation/latest.json")
          if sim_path.exists():
            sim = json.loads(sim_path.read_text(encoding="utf-8"))
            assert sim.get("schema_version") == "daily-jp-simulation-v1"
            for point in sim.get("equity_curve") or []:
              assert point.get("date") == point.get("execution_date")
              assert point.get("eval_date") <= point.get("execution_date")
          print("Daily auto verification passed.")
          PY

      - name: Commit generated Daily JP files
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          paths=(
            "site/data/prices-jp"
            "site/data/daily-jp"
            "site/data/backtest-daily-jp"
            "site/data/japan/daily/simulation"
            "site/data/daily-jp/simulation"
            "site/japan/daily/index.html"
            "site/japan/daily/backtest/index.html"
            "site/japan/daily/simulation/index.html"
            "site/assets/daily_jp.css"
            "site/assets/backtest_daily_jp.css"
            "site/assets/daily_simulation_jp.css"
            "site/index.html"
            "site/assets/index.css"
          )

          for path in "${paths[@]}"; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            else
              echo "Skip missing and untracked path: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No Daily JP generated changes to commit."
            exit 0
          fi

          git commit -m "Run Daily JP auto pipeline"
          git pull --rebase origin main
          git push origin main

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is still dirty after commit."
            git status --short
            exit 1
          fi
