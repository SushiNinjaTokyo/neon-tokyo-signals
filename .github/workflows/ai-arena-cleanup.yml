name: AI Arena Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE_OLD_AI_ARENA_FILES to remove obsolete AI Arena files"
        required: true
        default: ""

permissions:
  contents: write

concurrency:
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Confirm cleanup
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DELETE_OLD_AI_ARENA_FILES" ]; then
            echo "::error::Confirmation text mismatch. Cleanup aborted."
            exit 1
          fi

      - name: Delete obsolete AI Arena v1 files
        run: |
          set -euo pipefail
          obsolete=(
            "scripts/build_ai_arena_jp.py"
            "data/ai_arena_prompt_presets_jp.yml"
            "AI_ARENA_INSTALL_NOTES.md"
          )
          for p in "${obsolete[@]}"; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then
              git rm -r --ignore-unmatch "$p"
            else
              echo "Already absent: $p"
            fi
          done

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No obsolete files to remove."
            exit 0
          fi
          git commit -m "Clean obsolete AI Arena v1 files"
          git pull --rebase origin main
          git push origin main
