name: Daily JP simulation

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "full = rebuild JSON and render HTML, render_only = render existing JSON only"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - render_only
      fetch_data:
        description: "Fetch fresh JP prices before simulation"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sim_days:
        description: "Recent evaluation days to replay"
        required: false
        default: "220"
      run_daily_simulation:
        description: "Run Daily JP simulation"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: daily-jp-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-simulation:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      PRICES_JSON: site/data/prices-jp/latest.json
      DAILY_SIM_JSON: site/data/japan/daily/simulation/latest.json
      DAILY_JP_SIM_DAYS: ${{ github.event.inputs.sim_days || '220' }}
      DAILY_JP_SIM_TRADE_ONLY: "true"
      DAILY_JP_SIM_ALLOW_MONITOR: "false"
      DAILY_JP_SIM_ENTRY_SCORE_FLOOR: "500"
      DAILY_JP_SIM_BENCHMARK_SYMBOLS: "1306.T,1321.T,2516.T"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Validate Python scripts
        run: |
          set -euo pipefail
          python -m compileall \
            scripts/fetch_prices_jp.py \
            scripts/build_daily_jp.py \
            scripts/rebuild_daily_simulation_jp.py \
            scripts/render_daily_simulation_jp.py

      - name: Optionally fetch fresh JP prices
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'full' && github.event.inputs.fetch_data == 'true' }}
        run: |
          set -euo pipefail
          python scripts/fetch_prices_jp.py

      - name: Verify price JSON exists
        if: ${{ github.event.inputs.run_mode != 'render_only' }}
        run: |
          set -euo pipefail
          if [ ! -f site/data/prices-jp/latest.json ]; then
            echo "site/data/prices-jp/latest.json does not exist."
            echo "Run Fetch JP prices first or set fetch_data=true."
            exit 1
          fi

      - name: Rebuild Daily JP simulation
        if: ${{ github.event.inputs.run_mode != 'render_only' && github.event.inputs.run_daily_simulation != 'false' }}
        run: |
          set -euo pipefail
          python scripts/rebuild_daily_simulation_jp.py

      - name: Verify Daily JP simulation JSON
        if: ${{ github.event.inputs.run_daily_simulation != 'false' }}
        run: |
          set -euo pipefail
          test -f site/data/japan/daily/simulation/latest.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("site/data/japan/daily/simulation/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))

          assert data.get("schema_version") == "daily-jp-simulation-v1", data.get("schema_version")
          assert isinstance(data.get("summary"), dict), "summary missing"
          assert isinstance(data.get("equity_curve"), list), "equity_curve missing"
          assert isinstance(data.get("closed_trades"), list), "closed_trades missing"
          assert data.get("benchmark_quality"), "benchmark_quality missing"
          policy = data.get("policy") or {}
          assert policy.get("allow_monitor") is False, "Daily simulation must be trade-only"

          for point in data.get("equity_curve") or []:
            assert point.get("date") == point.get("execution_date"), "equity date must equal execution_date"
            assert point.get("eval_date") <= point.get("execution_date"), "eval_date must be <= execution_date"
            cash = float(point.get("cash_jpy") or 0)
            mv = float(point.get("market_value_jpy") or 0)
            eq = float(point.get("portfolio_equity_jpy") or 0)
            assert abs((cash + mv) - eq) < max(10.0, abs(eq) * 0.0001), "cash + market_value != equity"

          print("daily simulation generated_at=", data.get("generated_at"))
          print("daily simulation range=", data.get("range"))
          print("daily simulation return=", data.get("summary", {}).get("strategy_return_pct"))
          PY

      - name: Render Daily JP simulation page
        if: ${{ github.event.inputs.run_daily_simulation != 'false' }}
        run: |
          set -euo pipefail
          python scripts/render_daily_simulation_jp.py

      - name: Verify rendered Daily JP simulation page
        if: ${{ github.event.inputs.run_daily_simulation != 'false' }}
        run: |
          set -euo pipefail
          test -f site/japan/daily/simulation/index.html
          test -f site/assets/daily_simulation_jp.css

          python - <<'PY'
          from pathlib import Path
          html = Path("site/japan/daily/simulation/index.html").read_text(encoding="utf-8")
          css = Path("site/assets/daily_simulation_jp.css").read_text(encoding="utf-8")
          assert len(html) > 1000, "simulation HTML too small"
          assert len(css) > 1000, "simulation CSS too small"
          for token in ["<!doctype html>", "Daily JP Trade Simulation", "EQUITY CURVE", "TRADE QUALITY"]:
              assert token in html, f"missing skeleton token: {token}"
          for token in ["{{", "{%", "%}", "Traceback", "UndefinedError"]:
              assert token not in html, f"unrendered/error token: {token}"
          print("daily simulation html bytes=", len(html))
          print("daily simulation css bytes=", len(css))
          PY

      - name: Commit generated Daily JP simulation files
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          paths=(
            "site/data/japan/daily/simulation"
            "site/data/daily-jp/simulation"
            "site/japan/daily/simulation/index.html"
            "site/assets/daily_simulation_jp.css"
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.fetch_data || 'false' }}" = "true" ]; then
            paths+=("site/data/prices-jp")
          fi

          for path in "${paths[@]}"; do
            if [ -e "$path" ] || [ -n "$(git ls-files -- "$path")" ]; then
              git add -A -- "$path"
            else
              echo "Skip missing and untracked path: $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No Daily JP simulation changes to commit."
            exit 0
          fi

          git commit -m "Update Daily JP simulation"
          git pull --rebase origin main
          git push origin main

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is still dirty after commit."
            git status --short
            exit 1
          fi
