name: Render static site only

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      OUT_DIR: site
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-render.txt ]; then
            pip install -r requirements-render.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Jinja2
          fi

      - name: Sync latest main before generation
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Validate Python scripts
        run: |
          set -euo pipefail
          python -m compileall scripts

      - name: Render static site
        run: |
          set -euo pipefail
          python scripts/render_all.py

      - name: Verify required outputs
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/japan/daily/index.html
          test -f site/japan/weekly/index.html
          test -f site/disclaimer/index.html
          test -f site/privacy/index.html
          test -f site/assets/base.css
          test -f site/assets/index.css
          test -f site/assets/daily_jp.css
          test -f site/assets/weekly_jp.css

      - name: Commit rendered site
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"

          git add -f site

          if git diff --cached --quiet; then
            echo "No rendered changes to commit."
            exit 0
          fi

          git commit -m "Render static site"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push rejected. Fetching origin/main and retrying ($i/3)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase failed. Aborting to avoid overwriting generated files."
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done

          echo "Push failed after retries."
          exit 1
