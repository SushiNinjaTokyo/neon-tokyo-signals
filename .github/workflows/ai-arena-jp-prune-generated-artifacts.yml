name: AI Arena JP prune generated artifacts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report deletions"
        required: true
        default: "true"
      commit_outputs:
        description: "Commit prune report and deletions"
        required: true
        default: "true"
  # Enable after manual verification:
  # schedule:
  #   - cron: "00 11 * * 1-5"  # 20:00 JST on weekdays

permissions:
  contents: write

concurrency:
  group: neon-tokyo-site-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OUT_DIR: site

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt
      - name: Pull latest main
        run: |
          set -euo pipefail
          git pull --ff-only origin main

      - name: Prune
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python scripts/prune_ai_arena_generated_artifacts.py
      - name: Commit prune changes
        if: ${{ inputs.commit_outputs == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A site/data/japan/ai-arena/prune-report.json site/data/prices-jp site/data/japan/agent-scores
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prune AI Arena generated artifacts"
          git push origin HEAD:main
