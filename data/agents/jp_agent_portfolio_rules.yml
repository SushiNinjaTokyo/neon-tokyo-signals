schema_version: jp_agent_portfolio_rules_v1
rules_version: jp_agent_portfolio_2026_dev_v001
updated_at: 2026-05-29

# Portfolio rules are intentionally separated from signal rules.
# Signal rules answer "what should the agent buy/sell?".
# Portfolio rules answer "how much should the agent buy/sell?".
global:
  initial_capital_jpy: 10000000
  share_lot_size: 1
  allow_fractional_shares: false
  allow_short_selling: false
  allow_margin: false
  commission_bps: 0
  slippage_bps: 10
  benchmark_ticker: 1306.T
  season_mode: calendar_year
  reset_each_year: true
  force_close_on_year_end: true
  year_end_exit_reason_code: YEAR_END_CLOSE
  entry_timing: next_open
  exit_timing: next_open
  fallback_exit_timing: same_day_close
  allow_same_ticker_across_agents: true
  allow_duplicate_ticker_within_agent: false

agents:
  daily_striker:
    max_positions: 8
    target_position_pct: 0.12
    max_position_pct: 0.18
    max_total_exposure_pct: 0.95
    max_new_entries_per_day: 2

  weekly_sage:
    max_positions: 8
    target_position_pct: 0.14
    max_position_pct: 0.20
    max_total_exposure_pct: 0.95
    max_new_entries_per_day: 2

  risk_sentinel:
    max_positions: 12
    target_position_pct: 0.07
    max_position_pct: 0.10
    max_total_exposure_pct: 0.75
    max_new_entries_per_day: 2

  discovery_scout:
    max_positions: 8
    target_position_pct: 0.10
    max_position_pct: 0.14
    max_total_exposure_pct: 0.80
    max_new_entries_per_day: 2

  contrarian_monk:
    max_positions: 8
    target_position_pct: 0.11
    max_position_pct: 0.16
    max_total_exposure_pct: 0.85
    max_new_entries_per_day: 2

  reversal_snapback:
    max_positions: 7
    target_position_pct: 0.10
    max_position_pct: 0.14
    max_total_exposure_pct: 0.75
    max_new_entries_per_day: 2

  value_mispricing:
    max_positions: 7
    target_position_pct: 0.12
    max_position_pct: 0.17
    max_total_exposure_pct: 0.85
    max_new_entries_per_day: 1
