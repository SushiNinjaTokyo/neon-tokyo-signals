schema_version: jp_agent_strategy_rules_v1
rules_version: jp_agent_strategy_2026_dev_v001
effective_date: 2026-01-01
updated_at: 2026-05-29

# Rules in this file are intentionally plain YAML so the strategy can be tuned
# without editing Python. The engine only uses fields it explicitly supports;
# unsupported fields are still useful as documentation for future enhancements.
common:
  min_price_jpy: 50
  max_price_jpy: 200000
  missing_price_exit_after_days: 5
  stale_price_exit_reason_code: STALE_PRICE_EXIT
  score_collapse_exit_reason_code: SCORE_COLLAPSE
  liquidity_exit_reason_code: LIQUIDITY_DRYUP

agents:
  daily_striker:
    exit_style: momentum_decay
    year_end_entry_block_trading_days: 3
    entry:
      min_score: 0.78
      max_rank_per_day: 5
      allowed_actions: [Trade]
      min_liquidity_score: 0.35
      min_avg_traded_value_20d_jpy: 50000000
      require_price_above_ma20: true
      require_volume_ratio_20d_min: 1.15
      reject_if_rsi_14_gt: 82
    exit:
      hard_stop_loss_pct: -5.5
      take_profit_pct: 11
      trailing_stop_pct: 6
      max_holding_days: 6
      score_below: 0.48
      price_below_ma10: true
      volume_ratio_20d_below: 0.80

  weekly_sage:
    exit_style: trend_break
    year_end_entry_block_trading_days: 10
    entry:
      min_score: 0.82
      max_rank_per_day: 6
      allowed_actions: [Trade]
      min_liquidity_score: 0.35
      min_avg_traded_value_20d_jpy: 80000000
      require_price_above_ma50: true
      require_return_60d_pct_min: 3
      reject_if_volatility_60d_annualized_pct_gt: 95
    exit:
      hard_stop_loss_pct: -8.5
      take_profit_pct: 24
      trailing_stop_pct: 11
      max_holding_days: 30
      score_below: 0.50
      price_below_ma50: true
      trend_score_weekly_proxy_below: 0.48

  risk_sentinel:
    exit_style: capital_preservation
    year_end_entry_block_trading_days: 5
    entry:
      min_score: 0.88
      max_rank_per_day: 4
      allowed_actions: [Trade]
      min_liquidity_score: 0.65
      min_avg_traded_value_20d_jpy: 250000000
      reject_if_volatility_60d_annualized_pct_gt: 55
      reject_if_max_drawdown_60d_pct_lt: -22
      require_price_above_ma120: true
    exit:
      hard_stop_loss_pct: -3.5
      take_profit_pct: 8
      trailing_stop_pct: 4.5
      max_holding_days: 12
      score_below: 0.62
      risk_score_below: 0.58
      liquidity_score_below: 0.65
      volatility_20d_annualized_pct_above: 55
      price_below_ma50: true

  discovery_scout:
    exit_style: discovery_risk
    year_end_entry_block_trading_days: 5
    entry:
      min_score: 0.84
      max_rank_per_day: 4
      allowed_actions: [Trade]
      require_bucket: small_discovery
      min_liquidity_score: 0.20
      min_avg_traded_value_20d_jpy: 20000000
      require_volume_ratio_20d_min: 1.20
      reject_if_return_5d_pct_gt: 35
    exit:
      hard_stop_loss_pct: -7
      take_profit_pct: 18
      trailing_stop_pct: 8
      max_holding_days: 10
      score_below: 0.46
      liquidity_score_below: 0.30
      avg_traded_value_20d_jpy_below: 15000000
      return_3d_pct_below: -8
      price_below_ma20: true

  contrarian_monk:
    exit_style: pullback_resolution
    year_end_entry_block_trading_days: 7
    entry:
      min_score: 0.76
      max_rank_per_day: 5
      allowed_actions: [Trade]
      min_liquidity_score: 0.30
      min_avg_traded_value_20d_jpy: 50000000
      require_trend_score_weekly_proxy_min: 0.45
      require_price_above_ma120: true
      require_rsi_14_between: [35, 66]
      require_price_vs_ma50_pct_between: [-12, 12]
      reject_if_return_20d_pct_lt: -18
    exit:
      hard_stop_loss_pct: -6
      take_profit_pct: 13
      trailing_stop_pct: 7
      max_holding_days: 16
      score_below: 0.44
      price_below_ma120: true
      trend_score_weekly_proxy_below: 0.45
      rsi_14_below: 32

  reversal_snapback:
    exit_style: snapback_harvest
    year_end_entry_block_trading_days: 3
    entry:
      min_score: 0.70
      max_rank_per_day: 5
      allowed_actions: [Trade]
      min_liquidity_score: 0.25
      min_avg_traded_value_20d_jpy: 30000000
      require_rsi_14_max: 45
      require_bollinger_b_20_max: 0.45
      require_return_5d_pct_max: 4
      require_reversal_exhaustion_score_min: 0.45
    exit:
      hard_stop_loss_pct: -4.8
      take_profit_pct: 9
      trailing_stop_pct: 4.5
      max_holding_days: 5
      score_below: 0.42
      rsi_14_above: 58
      bollinger_b_20_above: 0.55
      return_3d_pct_above: 7
      exit_if_no_positive_close_after_days: 3

  value_mispricing:
    exit_style: mispricing_resolution
    year_end_entry_block_trading_days: 10
    entry:
      min_score: 0.86
      max_rank_per_day: 3
      allowed_actions: [Trade]
      min_liquidity_score: 0.35
      min_avg_traded_value_20d_jpy: 50000000
      require_price_above_ma20: true
      require_range_position_252d_0_1_max: 0.72
      reject_if_return_60d_pct_lt: -35
    exit:
      hard_stop_loss_pct: -7
      take_profit_pct: 16
      trailing_stop_pct: 8
      max_holding_days: 25
      score_below: 0.48
      range_position_252d_0_1_above: 0.78
      return_20d_pct_above: 18
      liquidity_score_below: 0.35
