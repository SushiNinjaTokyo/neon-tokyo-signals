      cooldown_after_loss_days: 20
      max_closed_trades_per_symbol_per_season: 2
      reject_if_symbol_realized_pnl_negative_after_trades: 2
    exit:
      hard_stop_loss_pct:
        BULL: -5.0
        NEUTRAL: -4.5
        BEAR: -3.8
        default: -4.5
      take_profit_pct: 18
      trailing_stop_pct: 8.0
      max_holding_days: 45
      score_below: 0.42
      range_position_252d_0_1_above: 0.92
      return_20d_pct_above: 28
      liquidity_score_below: 0.3
      early_fail:
