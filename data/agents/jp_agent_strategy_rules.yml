        return_20d_pct_gt: 50
        rsi_14_gt: 78
      require_market_cap_jpy_min: 5000000000
      require_market_cap_jpy_max: 1000000000000
      require_operating_margin_pct_min: -5
      require_roe_pct_min: -10
      reject_if_psr_gt: 20
      reject_if_pbr_gt: 15
      require_quality_guard_score_min: 0.25
      reject_if_value_trap_penalty_gt: 0.82
      market_regime_rules:
        BULL:
          min_score: 0.64
          min_liquidity_score: 0.38
          min_avg_traded_value_20d_jpy: 80000000
          require_volume_ratio_20d_min: 1.0
          position_size_multiplier: 1.0
        NEUTRAL:
          min_score: 0.68
          min_liquidity_score: 0.45
          min_avg_traded_value_20d_jpy: 120000000
          require_volume_ratio_20d_min: 1.1
          position_size_multiplier: 0.85
        BEAR:
          min_score: 0.76
          min_liquidity_score: 0.6
          min_avg_traded_value_20d_jpy: 200000000
          require_volume_ratio_20d_min: 1.5
          position_size_multiplier: 0.5
        PANIC:
          new_entries_enabled: false
      discovery_financial_setup:
        require_market_cap_jpy_min: 5000000000
        require_market_cap_jpy_max: 1000000000000
        require_quality_guard_score_min: 0.25
        reject_if_value_trap_penalty_gt: 0.82
        require_volume_ratio_20d_min: 1.0
        require_range_position_60d_0_1_min: 0.3
        require_liquidity_score_min: 0.38
        require_avg_traded_value_20d_jpy_min: 80000000
      discovery_score_setup:
        min_score: 0.64
        require_volume_ratio_20d_min: 1.0
        require_range_position_60d_0_1_min: 0.3
        require_market_cap_jpy_max: 1000000000000
        require_liquidity_score_min: 0.38
    exit:
      hard_stop_loss_pct:
        BULL: -7.0
        NEUTRAL: -6.2
        BEAR: -5.2
        default: -6.2
      take_profit_pct: 24
      trailing_stop_pct: 8.5
      max_holding_days: 25
      score_below: 0.46
      liquidity_score_below: 0.3
      avg_traded_value_20d_jpy_below: 50000000
      return_3d_pct_below: -8
      price_below_ma20: true
      early_fail:
        enabled: true
        after_days: 3
        code: EARLY_FAIL
        require_all:
          mfe_below_pct: 1.5
          current_return_below_pct: -3.0
          volume_ratio_20d_below: 1.0
      liquidity_exit:
        enabled: true
        after_days: 5
        code: LIQUIDITY_DRYUP
        require_all:
          volume_ratio_20d_below: 0.75
          current_return_pct_below: 3.0
      mfe_profit_protection:
      - mfe_pct: 8
        floor_return_pct: 2.5
        code: DISCOVERY_PROFIT_PROTECTION_1
      - mfe_pct: 14
        floor_return_pct: 6.0
        code: DISCOVERY_PROFIT_PROTECTION_2
      - mfe_pct: 25
        floor_return_pct: 12.0
        code: DISCOVERY_RUNNER_PROTECTION
      theme_trend_extension:
        enabled: true
        extend_max_holding_days_to: 60
        code: THEME_TREND_CONTINUES
        require_all:
        - current_return_pct_gt: 0
        - volume_ratio_20d_gte: 1.1
        - return_20d_pct_gte: 5
        require_any:
        - manual_theme_include: true
        - mfe_pct_gte: 14
        - re_rating_signal_score_gte: 0.55
  contrarian_monk:
    exit_style: pullback_resolution
    year_end_entry_block_trading_days: 7
    entry:
      min_score: 0.72
      max_rank_per_day: 8
      allowed_actions:
      - Trade
      min_liquidity_score: 0.3
      min_avg_traded_value_20d_jpy: 50000000
      require_trend_score_weekly_proxy_min: 0.5
      require_price_above_ma120: true
      require_rsi_14_between:
      - 38
      - 62
      require_price_vs_ma50_pct_between:
