# AI Arena JP strategy rules.
# v018: HIZUMI/SAGURI Entry+Exit optimization with market-regime, dynamic hard stops,
#       early validation, MFE profit protection, and conditional long-hold extensions.
schema_version: jp_agent_strategy_rules_v1
rules_version: jp_agent_strategy_2026_dev_v018_hizumi_saguri_entry_exit
effective_date: 2026-01-01
updated_at: '2026-06-02'
common:
  min_price_jpy: 50
  max_price_jpy: 200000
  missing_price_exit_after_days: 5
  stale_price_exit_reason_code: STALE_PRICE_EXIT
  score_collapse_exit_reason_code: SCORE_COLLAPSE
  liquidity_exit_reason_code: LIQUIDITY_DRYUP
agents:
  daily_striker:
    exit_style: momentum_decay
    year_end_entry_block_trading_days: 3
    entry:
      min_score: 0.74
      max_rank_per_day: 6
      allowed_actions:
      - Trade
      min_liquidity_score: 0.35
      min_avg_traded_value_20d_jpy: 100000000
      require_price_above_ma20: true
      require_volume_ratio_20d_min: 1.6
      require_return_1d_pct_min: 0.4
      require_range_position_20d_0_1_min: 0.78
      require_range_position_252d_0_1_min: 0.42
      reject_if_rsi_14_gt: 76
      reject_if_return_5d_pct_gt: 18
      reject_if_return_20d_pct_gt: 55
      reject_if_volatility_60d_annualized_pct_gt: 125
    exit:
      hard_stop_loss_pct: -5.8
      take_profit_pct: 16
      trailing_stop_pct: 7.5
      max_holding_days: 10
      score_below: 0.46
      price_below_ma10: true
      volume_ratio_20d_below: 0.7
      return_3d_pct_below: -5
      mfe_profit_protection:
      - mfe_pct: 8
        floor_return_pct: 3
        code: PROFIT_PROTECTION
      - mfe_pct: 12
        floor_return_pct: 5
        code: PROFIT_PROTECTION
  weekly_sage:
    exit_style: trend_break
    year_end_entry_block_trading_days: 10
    entry:
      min_score: 0.76
      max_rank_per_day: 10
      allowed_actions:
      - Trade
      min_liquidity_score: 0.35
      min_avg_traded_value_20d_jpy: 80000000
      require_price_above_ma50: true
      require_trend_score_weekly_proxy_min: 0.55
      require_return_60d_pct_min: 5
      reject_if_return_20d_pct_gt: 45
      reject_if_volatility_60d_annualized_pct_gt: 90
      market_regime_rules:
        BEAR:
          position_size_multiplier: 0.7
        PANIC:
          position_size_multiplier: 0.5
          min_score: 0.82
    exit:
      hard_stop_loss_pct: -9.5
      take_profit_pct: 30
      trailing_stop_pct: 13
      max_holding_days: 45
      score_below: 0.46
      price_below_ma50: true
      trend_score_weekly_proxy_below: 0.44
      early_fail_after_days: 7
      early_fail_mfe_below_pct: 3
      early_fail_return_below_pct: -6
  risk_sentinel:
    exit_style: capital_preservation
    year_end_entry_block_trading_days: 5
    entry:
      min_score: 0.82
      max_rank_per_day: 8
      allowed_actions:
      - Trade
      min_liquidity_score: 0.68
      min_avg_traded_value_20d_jpy: 300000000
      reject_if_volatility_60d_annualized_pct_gt: 50
      reject_if_max_drawdown_60d_pct_lt: -18
      reject_if_return_20d_pct_lt: -8
      reject_if_rsi_14_gt: 74
      require_price_above_ma50: true
      require_price_above_ma120: true
      require_trend_score_weekly_proxy_min: 0.42
    exit:
      hard_stop_loss_pct: -4.2
      take_profit_pct: 10
      trailing_stop_pct: 5.5
      max_holding_days: 18
      score_below: 0.56
      risk_score_below: 0.52
      liquidity_score_below: 0.65
      volatility_20d_annualized_pct_above: 55
      price_below_ma50: true
      early_fail_after_days: 3
      early_fail_mfe_below_pct: 1
      early_fail_return_below_pct: -5
  discovery_scout:
    exit_style: discovery_risk
    year_end_entry_block_trading_days: 5
    entry:
      min_score: 0.64
      max_rank_per_day: 14
      allowed_actions:
      - Trade
      allowed_buckets:
      - small_discovery
      - discovery
      - early_breakout
      - emerging_growth
      - liquid_growth
      - speculative_growth
      - small_growth
      - growth
      - core_growth
      - momentum
      - breakout
      - watch_growth
      - value_growth
      bucket_optional_if_financial_setup: true
      bucket_optional_if_score_setup: true
      allow_bucket_bypass_for_discovery_setup: true
      min_liquidity_score: 0.38
      min_avg_traded_value_20d_jpy: 80000000
      require_volume_ratio_20d_min: 1.0
      require_return_5d_pct_min: -2
      reject_if_return_20d_pct_lt: -5
      reject_if_return_5d_pct_gt: 22
      reject_if_return_20d_pct_gt: 80
      reject_if_rsi_14_gt: 88
