      require_sector_relative_valuation_score_min: 0.45
      require_sector_relative_value_confidence_min: 0.35
      reject_if_sector_relative_valuation_score_lt: 0.30
      require_quality_guard_score_min: 0.35
      require_sector_relative_quality_score_min: 0.25
      require_roe_pct_min: 4
      require_operating_margin_pct_min: 2
      reject_if_value_trap_penalty_gt: 0.45
      reject_if_psr_gt: 10
      reject_if_pbr_gt: 6
