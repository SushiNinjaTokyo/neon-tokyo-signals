    exit_style: snapback_harvest
    year_end_entry_block_trading_days: 3
    entry:
      min_score: 0.68
      max_rank_per_day: 5
      allowed_actions:
      - Trade
      min_liquidity_score: 0.25
      min_avg_traded_value_20d_jpy: 30000000
      require_rsi_14_max: 42
      require_bollinger_b_20_max: 0.45
      require_return_5d_pct_max: 4
      require_reversal_exhaustion_score_min: 0.45
      reject_if_return_5d_pct_lt: -22
      reject_if_return_20d_pct_lt: -35
      reject_if_rsi_14_lt: 12
      reject_if_range_position_252d_0_1_lt: 0.03
      reversal_confirmation_min_count: 1
      reversal_confirmation_any:
        return_1d_pct_min: 0
        volume_ratio_20d_min: 1.2
        range_position_20d_0_1_min: 0.18
        price_above_ma5: true
        volume_reaccumulation_score_min: 0.1
      market_regime_rules:
        BULL:
          min_score: 0.68
          reversal_confirmation_min_count: 1
          position_size_multiplier: 1.0
        NEUTRAL:
          min_score: 0.7
          reversal_confirmation_min_count: 1
          position_size_multiplier: 0.9
        BEAR:
          min_score: 0.74
          reversal_confirmation_min_count: 2
          position_size_multiplier: 0.5
        PANIC:
          new_entries_enabled: false
    exit:
      hard_stop_loss_pct: -4.0
      take_profit_pct: 8
      trailing_stop_pct: 4.5
      max_holding_days: 12
      score_below: 0.42
      rsi_14_above: 58
      bollinger_b_20_above: 0.55
      return_3d_pct_above: 7
      exit_if_no_positive_close_after_days: 3
      early_fail_after_days: 2
      early_fail_mfe_below_pct: 1.5
      early_fail_return_below_pct: -2
      mfe_profit_protection:
      - mfe_pct: 5
        floor_return_pct: 2
        code: SNAPBACK_PROFIT_PROTECTION
      - mfe_pct: 8
        floor_return_pct: 4
        code: SNAPBACK_PROFIT_PROTECTION
  value_mispricing:
