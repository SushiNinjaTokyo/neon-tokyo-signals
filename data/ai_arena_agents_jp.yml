# Neon Tokyo AI Arena configuration
# ------------------------------------------------------------
# This file is the main maintenance surface for AI Arena.
# You can tune agent count, style, screening profile and trading policy here
# without editing the simulation engine.
#
# Core design:
# - Trading / screening is deterministic Python logic using these settings.
# - AI generates the Market Master brief and debate text only.
# - The Arena can eventually replace the standalone Daily / Weekly pages, so
#   all Arena outputs live under site/data/japan/ai-arena/.

arena:
  name: "Neon Tokyo AI Arena"
  version: "v2"
  timezone: "Asia/Tokyo"
  default_model: "gpt-4o-mini"
  future_market_master_model: "gpt-5.5"
  initial_capital_jpy: 10000000
  lot_size: 100
  benchmark_symbol: "1306.T"
  # The current release does not fetch external news. Market Master only uses
  # supplied signal / simulation / market data and must not invent headlines.
  external_news_enabled: false
  disclaimer: "AI Arena is a quantitative simulation and discussion game. Informational only. Not investment advice."

simulation:
  # Used when workflow inputs are blank.
  default_lookback_days: 90
  # All agents are evaluated with the same execution clock.
  # signal_date close -> next trading day open entry -> close valuation.
  entry_timing: "next_open"
  valuation_timing: "close"
  monthly_season_reset: true
  max_orders_per_agent_per_day: 2
  allow_reentry_same_symbol: false

market_master:
  id: "market_master"
  name: "Market Master"
  title: "World-class Japan Market Analyst"
  enabled: true
  model: "gpt-4o-mini"
  future_model: "gpt-5.5"
  role: |
    Reads the Arena simulation state, index tone, theme concentration and risk context.
    Produces a short, professional market brief for global investors.
  system_prompt: |
    You are Market Master, a world-class global market analyst for Japanese equities.
    Use only provided data. Do not invent headlines, macro events, company news, or fundamental claims.
    Focus on index tone, signal breadth, theme concentration, agent positioning, liquidity and risk.
    Never say buy, sell, recommendation, target price, guaranteed, or must own.

# Screening profile notes:
# - daily_v2_core mirrors the current Daily idea: short-term event timing.
# - weekly_stage2 mirrors the current Weekly idea: trend template / stage 2.
# - other profiles are deliberately different so Agent rankings become interesting.
# - weights are deliberately readable and easy to edit.
screening_profiles:
  daily_v2_core:
    description: "Daily-style short-term event score: score, 5D strength, volume shock, entry timing."
    universe:
      buckets: ["Core", "Discovery"]
      min_liquidity_score: 0.35
      allow_triage: ["Trade", "Watch", "Monitor", "Ignore"]
    weights:
      score_norm: 0.36
      return_5d_norm: 0.18
      return_3d_norm: 0.10
      volume_ratio_norm: 0.18
      liquidity_score: 0.08
      extension_control: 0.10
    penalties:
      ignore_triage: -0.08
      high_extension: -0.10
      weak_1d: -0.04

  weekly_stage2:
    description: "Weekly-style medium-term leader: 20D trend, weekly score, liquidity, controlled extension."
    universe:
      buckets: ["Core", "Discovery"]
      min_liquidity_score: 0.45
      allow_triage: ["Trade", "Watch", "Monitor", "Ignore"]
    weights:
      weekly_score_norm: 0.34
      return_20d_norm: 0.22
      return_5d_norm: 0.10
      liquidity_score: 0.12
      theme_heat: 0.12
      extension_control: 0.10
    penalties:
      deep_5d_drop: -0.08
      high_extension: -0.06

  risk_defender:
    description: "Low-noise liquid setup: liquidity, drawdown control, moderate momentum."
    universe:
      buckets: ["Core"]
      min_liquidity_score: 0.70
      allow_triage: ["Trade", "Watch", "Monitor", "Ignore"]
    weights:
      liquidity_score: 0.30
      extension_control: 0.25
      score_norm: 0.16
      return_20d_norm: 0.12
      return_5d_norm: 0.07
      volume_ratio_norm: 0.10
    penalties:
      negative_5d: -0.08
      high_extension: -0.12
      weak_liquidity: -0.20

  discovery_alpha:
    description: "Discovery hunter: smaller / under-watched names with theme heat and early momentum."
    universe:
      buckets: ["Discovery"]
      min_liquidity_score: 0.25
      allow_triage: ["Trade", "Watch", "Monitor", "Ignore"]
    weights:
      discovery_bonus: 0.22
      theme_heat: 0.22
      return_5d_norm: 0.18
      volume_ratio_norm: 0.16
      score_norm: 0.14
      liquidity_score: 0.08
    penalties:
      weak_liquidity: -0.12
      high_extension: -0.10
      negative_5d: -0.08

  contrarian_reentry:
    description: "Contrarian re-entry: strong 20D / theme, weak short-term, low extension."
    universe:
      buckets: ["Core", "Discovery"]
      min_liquidity_score: 0.50
      allow_triage: ["Trade", "Watch", "Monitor", "Ignore"]
    weights:
      return_20d_norm: 0.24
      short_term_pullback: 0.22
      extension_control: 0.20
      liquidity_score: 0.14
      theme_heat: 0.12
      score_norm: 0.08
    penalties:
      collapse_20d: -0.18
      illiquid: -0.12

agents:
  - id: "daily_striker"
    name: "Daily Striker"
    class: "Daily"
    enabled: true
    model: "gpt-4o-mini"
    screening_profile: "daily_v2_core"
    avatar_style: "pixel_warrior"
    avatar_image: "/assets/ai-arena/agents/daily_striker.png"
    ui_tone: "cyan"
    personality: "Fast, impatient, and obsessed with short-term pressure."
    philosophy: "Daily event timing matters; price and volume reveal the first move."
    trading_policy:
      max_positions: 5
      position_size_pct: 0.20
      allow_minimum_lot_entry: true
      max_holding_days: 5
      stop_loss_pct: -6.0
      take_profit_pct: 12.0
      min_agent_score: 0.52

  - id: "weekly_sage"
    name: "Weekly Sage"
    class: "Weekly"
    enabled: true
    model: "gpt-4o-mini"
    screening_profile: "weekly_stage2"
    avatar_style: "pixel_mage"
    avatar_image: "/assets/ai-arena/agents/weekly_sage.png"
    ui_tone: "violet"
    personality: "Patient, trend-aware, and allergic to daily noise."
    philosophy: "The best Japan leaders prove themselves on the weekly tape first."
    trading_policy:
      max_positions: 5
      position_size_pct: 0.20
      allow_minimum_lot_entry: true
      max_holding_days: 15
      stop_loss_pct: -8.0
      take_profit_pct: 18.0
      min_agent_score: 0.50

  - id: "risk_sentinel"
    name: "Risk Sentinel"
    class: "Defender"
    enabled: true
    model: "gpt-4o-mini"
    screening_profile: "risk_defender"
    avatar_style: "pixel_shield"
    avatar_image: "/assets/ai-arena/agents/risk_sentinel.png"
    ui_tone: "blue"
    personality: "Calm, skeptical, and disciplined. The brake pedal inside the Arena."
    philosophy: "A strong signal is worthless if it cannot survive volatility and liquidity gaps."
    trading_policy:
      max_positions: 4
      position_size_pct: 0.16
      allow_minimum_lot_entry: true
      max_holding_days: 6
      stop_loss_pct: -3.5
      take_profit_pct: 8.0
      min_agent_score: 0.56

  - id: "discovery_scout"
    name: "Discovery Scout"
    class: "Scout"
    enabled: true
    model: "gpt-4o-mini"
    screening_profile: "discovery_alpha"
    avatar_style: "pixel_archer"
    avatar_image: "/assets/ai-arena/agents/discovery_scout.png"
    ui_tone: "green"
    personality: "Curious, energetic, and slightly mischievous. Hunts under-watched Japan."
    philosophy: "The edge is often where global investors have not looked yet."
    trading_policy:
      max_positions: 6
      position_size_pct: 0.12
      allow_minimum_lot_entry: true
      max_holding_days: 7
      stop_loss_pct: -7.0
      take_profit_pct: 16.0
      min_agent_score: 0.50

  - id: "contrarian_monk"
    name: "Contrarian Monk"
    class: "Reversal"
    enabled: true
    model: "gpt-4o-mini"
    screening_profile: "contrarian_reentry"
    avatar_style: "pixel_monk"
    avatar_image: "/assets/ai-arena/agents/contrarian_monk.png"
    ui_tone: "amber"
    personality: "Dry, patient, analytical. Distrusts crowded heat."
    philosophy: "Controlled re-entry can beat obvious momentum when the crowd gets late."
    trading_policy:
      max_positions: 5
      position_size_pct: 0.18
      allow_minimum_lot_entry: true
      max_holding_days: 10
      stop_loss_pct: -5.0
      take_profit_pct: 12.0
      min_agent_score: 0.50
